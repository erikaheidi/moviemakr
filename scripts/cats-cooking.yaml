# A three-scene short: the chef cat cooks, serves, and sets his guests on fire.
#
#   ./moviemakr.py render scripts/cats-cooking.yaml --dry-run   # look before you leap
#   ./moviemakr.py render scripts/cats-cooking.yaml
#   ./moviemakr.py status scripts/cats-cooking.yaml
name: cats-cooking

model:
  root: /home/erika/Projects/ai-models
  diffusion_model: minimax-h3/minimax_h3_ref2va_pruned-Q8_0.gguf
  llm:             minimax-h3/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  vae:             minimax-h3/minimax_h3_video_vae_fp16.safetensors
  audio_vae:       minimax-h3/minimax_h3_audio_vae_fp32.safetensors

docker:
  image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan
  devices: [/dev/dri/card1, /dev/dri/renderD128, /dev/kfd]
  run_as_current_user: true

defaults:
  # 544 not 540: the model rounds dimensions up to a multiple of 32 anyway, so
  # asking for 544 means the output is exactly the size you asked for.
  width: 544
  height: 960
  fps: 24
  video_frames: 90          # ~3.75s, about what fits in one pass here
  cfg_scale: 1.0
  seed: 42
  negative_prompt: ""
  # Appended to every prompt. Put the *look* here and the *action* in each
  # scene, so the style stays fixed while the story moves.
  style_suffix: >-
    Warm cinematic lighting, shallow depth of field, photorealistic,
    film grain.
  # Matching example.yaml exactly (te on CPU, VAE on GPU) to test whether the
  # reference video was the reason this ran on CPU while the example used the GPU.
  extra_args: ["--diffusion-fa", "--mmap", "--backend", "te=cpu"]

continuity:
  # A reference *video*, not a still. This model is Ref2VA: it takes video
  # references natively, and a clip carries the chef's appearance and the way
  # he moves, which a single frame cannot.
  #
  # cat-cooking.webm is landscape 1024x768 and this movie is portrait 544x960.
  # moviemakr centre-crops each frame to the target aspect before scaling, so
  # the cat keeps his proportions instead of being squashed. Frames land in
  # renders/cats-cooking/refvideos/ if you want to check the reframing.
  # Disabled for the GPU test: no reference video, like example.yaml. Restore by
  # uncommenting the line below.
  anchor_videos: []
  #  - /home/erika/Projects/ai-models/cat-cooking.webm

  # Also hand each scene the final frame of the one before it, so shots flow
  # into each other instead of cutting to an unrelated room.
  chain_from_previous: true

output:
  container: mp4
  audio: keep               # the model scores each scene itself
  music: null

scenes:
  # Scene 1 has nothing before it to chain from, so it leans entirely on the
  # reference video. Keeping this prompt close to what the reference shows
  # gives the model an easy first shot to match.
  - id: cooking
    chain_from_previous: false
    prompt: >-
      An orange tabby cat in a white chef hat and white apron stands upright at
      a stove, tossing vegetables in a frying pan and stirring with a wooden
      spoon. Steam rises from the pan.

  # From here the chef has to stay recognisably the same cat while the setting
  # changes - that is what the anchor video is doing.
  - id: serving
    prompt: >-
      The same orange tabby chef cat carries a steaming plate of food to a
      restaurant table where two cats sit waiting, napkins tucked in. Warm
      lamplight, quiet restaurant interior.

  # The payoff shot. Physical comedy needs a little longer to land, so this one
  # gets more frames than the others.
  - id: too-spicy
    video_frames: 100
    prompt: >-
      The scene now shows a close-up of two seated cats taking a bite of the fiery red dish and reacting in shock, 
      both with eyes wide looking at each other, faces flushing red, puffs of steam bursting from their ears as
      they fan their mouths with their paws.
  
  - id: chef-reaction
    video_frames: 100
    prompt: >-
      The scene cuts to the same orange tabby chef cat, who is now standing behind the counter, 
      laughing out loud. He is holding a bottle of "the world's hottest sauce".