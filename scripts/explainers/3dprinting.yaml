# 3dprinting-101 - an eight-scene narrated explainer: what FDM 3D printing is,
# what it prints with, and what you have to do to keep it printing.
#
#   ./moviemakr.py render scripts/explainers/3dprinting.yaml --dry-run
#   ./moviemakr.py render scripts/explainers/3dprinting.yaml --only 1
#   ./moviemakr.py render scripts/explainers/3dprinting.yaml
#   ./moviemakr.py status scripts/explainers/3dprinting.yaml
#
# Subject matter follows the section order of "3D Printing for Beginners"
# (https://stlfactory.net/learn/3d-printing-for-beginners): overview, how FDM
# works, filament, multi-material, supports, maintenance, slicing software. The
# narration lines are written for the ~4-second shot length, not lifted from the
# article.
#
# Prompts are written through the `h3-prompt-writing` skill in full-reference
# (Ref2VA) form - see .claude/skills/h3-prompt-writing/references/ref-en.txt.
# The same two adaptations as scripts/h3/josy-house-party.yaml apply, because
# moviemakr generates one shot per docker run rather than a whole movie:
#
#   1. Every scene is a single [Shot 1] with no cut timestamp. The cuts in this
#      explainer happen between docker runs, not inside them.
#   2. detailed_description runs ~130-170 words, not the guide's 350-500. That
#      range is for a full multi-shot video; one ~4-second shot carries far less.
#
# ---------------------------------------------------------------------------
# THE ANCHORS - what the two photos actually contain
# ---------------------------------------------------------------------------
# Every subject description in this file is written off these two stills. If you
# swap the photos, the descriptions have to be rewritten with them - generic
# wording renders a generic printer and the anchors will fight it.
#
#   3dprinter.jpg        - the whole machine on the desk, straight on. Open black
#                          powder-coated frame with bright orange printed corner
#                          brackets, two vertical polished steel lead screws, a
#                          wide flat black textured build plate, a black print
#                          head on a horizontal rail. Above it a black printed
#                          spool holder carries two reels, one dark graphite grey
#                          and one yellow, with a single pale strand running down
#                          into the head. Light plywood desk, deep teal-blue wall,
#                          a white filament-dryer box with a clear domed lid at
#                          left, a black control box with a small screen and an
#                          orange knob in front, and two finished prints on the
#                          desk - a dark faceted vase and a translucent
#                          amber-yellow fish figure.
#   3dprinter-nozzle.jpg - the print head close. Black carriage, black axial
#                          cooling fan at its centre, a small brass nozzle in a
#                          discoloured heater block below it, a fine pale strand
#                          hanging from the tip, an orange printed mount and black
#                          lead screw immediately behind, black textured bed sheet
#                          beneath.
#
# Both live under assets/ - the only read-only mount reference images can come
# from. load_script rejects paths outside it.
#
# The machine carries brand lettering on the frame and the print head. It is
# deliberately never described - see the content rules at the bottom of this
# header.
#
# ---------------------------------------------------------------------------
# THE <Picture N> CONTRACT - read before editing any prompt
# ---------------------------------------------------------------------------
# Refs reach sd-cli as: chained previous frame first (render() inserts it at
# index 0), then continuity.anchors in order, then any scene ref_images.
# With two anchors and chaining on, that fixes the labels for the whole file:
#
#   scene 1 (chain_from_previous: false, 2 refs):
#     <Picture 1> = assets/3dprinter.jpg
#     <Picture 2> = assets/3dprinter-nozzle.jpg
#
#   scenes 2-8 (chained, 3 refs):
#     <Picture 1> = the previous scene's last frame
#     <Picture 2> = assets/3dprinter.jpg
#     <Picture 3> = assets/3dprinter-nozzle.jpg
#
# If you turn chaining off on a scene, every label in it shifts down by one.
#
# <Subject N> numbering is per scene, in order of first appearance, as the guide
# specifies. The same print head is <Subject 2> in scene 1 and <Subject 1> in
# scene 2; that is correct, each scene is an independent generation.
#
# ---------------------------------------------------------------------------
# THE NARRATION - the thing this script exists to test
# ---------------------------------------------------------------------------
# Every scene carries exactly one narrator line, inside detailed_description,
# in the guide's required voiceover form (base-en.txt section 4.4):
#
#   ... (S1) says in an off-screen voiceover, <d>[English] ...</d>
#
# Four rules hold across all eight scenes:
#
#   1. The voice description is BYTE-IDENTICAL every time. Each scene is an
#      independent generation with no voice reference available, so that string
#      is the only lever on timbre consistency between scenes. If you retune it,
#      retune it in all eight, together.
#   2. 9-13 words per line, no more. josy-house-party's `good-girl` fits 13 words
#      in 107 frames (4.46s); 90 frames is 3.75s and holds about eleven.
#   3. The line starts early - the visual action is already underway when it
#      begins - so the tail is not truncated by the end of the video. If a line
#      does get clipped, SHORTEN THE LINE. Do not raise video_frames past 100
#      (see the ceiling note in defaults).
#   4. The narration is non-diegetic, so it does not appear in
#      overall_soundscape; that section carries printer mechanics only. And no
#      (S1) in retention_analysis, per the guide.
#
# Nothing in shot ever speaks, so there is no on-screen character whose lips
# have to be described as closed.
#
# If the narrator's timbre wanders badly between scenes, the fallback is to
# strip the <d> lines, re-render ambient-only, and mix one externally recorded
# voice track through output.music at music_gain_db: 0.
#
# ---------------------------------------------------------------------------
# TWO CONTENT RULES
# ---------------------------------------------------------------------------
#   - No legible text anywhere, and no brand marks. The lettering on the frame
#     and print head is never mentioned, and scene 8's slicing software is
#     described purely by appearance - dark viewport, banded model, coloured
#     toolpath - never named and never given words on screen. This model cannot
#     draw readable text; asked for it, it produces garbled glyphs.
#   - Hands, never faces. Scenes 4 and 7 need a person; they get forearms and
#     hands only. A generated stranger's face adds an identity the anchors
#     cannot hold across eight independent runs.
#
# Filament colours are pinned to the two reels actually on the machine -
# graphite grey and yellow - so the multi-material scene reads as this printer
# rather than a different one.
name: 3dprinting-101

model:
  root: /home/erika/Projects/ai-models
  diffusion_model: minimax-h3/minimax_h3_ref2va_pruned-Q8_0.gguf
  llm:             minimax-h3/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  vae:             minimax-h3/minimax_h3_video_vae_fp16.safetensors
  audio_vae:       minimax-h3/minimax_h3_audio_vae_fp32.safetensors

docker:
  image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan
  devices: [/dev/dri/card1, /dev/dri/renderD128, /dev/kfd]
  run_as_current_user: true

defaults:
  width: 544
  height: 960
  # ~3.75s. sd-cli rounds this UP, and not by one or two: measured on this box at
  # 544x960, 90 stays 90, 100 becomes 107, and 110 becomes 124. Check the
  # "generate_video 544x960xN" line in the log for what you actually got. 107 is
  # the largest count proven to render here - 124 DeviceLost'd at the VAE stage
  # three times out of three - so 100 is the ceiling for this script.
  video_frames: 90
  fps: 24
  cfg_scale: 1.0
  seed: 42
  negative_prompt: ""       # no effect at cfg_scale 1.0 - CFG is off, so the
                            # negative prompt is never evaluated. Steer with
                            # positive description instead.
  # MUST stay empty for H3-structured prompts. full_prompt() appends the suffix
  # as ". <suffix>" at the very end - which here is the end of
  # non_diegetic_music, so the style text would read as part of the score. The
  # look lives in each scene's detailed_description opening line instead.
  style_suffix: ""
  extra_args: ["--diffusion-fa", "--mmap", "--backend", "te=cpu"]

continuity:
  # Passed to every scene. Unlike a character short, what needs holding here is a
  # machine and a room: scenes 4, 7, and 8 cut to a subject the chained frame
  # does not contain (hands with finished prints, an idle cooled printer, a
  # monitor), and without the anchors those shots would invent a new printer.
  anchors:
    - 3dprinter.jpg
    - 3dprinter-nozzle.jpg

  # Reference *videos* stay empty on purpose: on this box a --ref-video either
  # crashes the GPU with DeviceLost or drags the whole pipeline onto the CPU.
  # Reference images do not - chaining has always used them.
  anchor_videos: []

  chain_from_previous: true

output:
  container: mp4
  audio: keep
  music: null

scenes:
  # -------------------------------------------------------------------------
  # 1. What it is.
  # -------------------------------------------------------------------------
  # The only scene with chain_from_previous: false, so it sees the two anchors
  # and nothing else. It also establishes the yellow part and its layer texture
  # that scenes 2, 5, and 6 all lean on, which is why it gets the extra frames.
  - id: what-it-is
    chain_from_previous: false
    video_frames: 100         # ~4.17s - the establishing shot carries the room
    prompt: |-
      subject_definitions:
      <Subject 1> is the desk 3D printer in <Picture 1>, an open-frame machine with a matte black powder-coated frame, bright orange printed corner brackets and end caps, two vertical polished steel lead screws, a wide flat black textured build plate, and a black print head riding a horizontal rail above it. A black printed spool holder mounted above the frame carries two reels, one dark graphite grey and one yellow, with a single pale strand running down from them into the print head.
      <Subject 2> is the black print head in <Picture 2>, a compact carriage with a black axial cooling fan at its centre and a small brass nozzle in a discoloured heater block below it, pointing straight down at the build plate.
      <Subject 3> is the desk workspace in <Picture 1>, with a light plywood work surface, a deep teal-blue wall behind, a white filament-dryer box with a clear domed lid at frame left, and a small black control box with an orange knob standing in front of the machine.

      summary:
      [reference generation] The target video is a slow push toward <Subject 1> running a print on the desk of <Subject 3>, the print head tracking back and forth while a half-finished yellow object stands on the black build plate, with an off-screen narrator introducing what 3D printing is. <Picture 1> supplies the machine and the workspace; <Picture 2> supplies the print head.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the matte black open frame, bright orange printed brackets, polished steel lead screws, wide black textured build plate, and the spool holder carrying a graphite grey reel and a yellow reel are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the black carriage, black axial cooling fan, and small brass nozzle in its discoloured heater block are retained, seen from a working distance on the rail.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the light plywood work surface, deep teal-blue wall, white domed filament-dryer box, and small black control box with an orange knob are retained.

      detailed_description:
      The target video is photorealistic live-action footage, clean and technical, lit by soft even indoor light, with shallow depth of field and fine film grain.
      [Shot 1] A medium wide shot frames <Subject 1> standing on the plywood work surface of <Subject 3> against the deep teal-blue wall, already part-way through a print. <Subject 2>, the black carriage with its axial cooling fan and small brass nozzle, tracks smoothly left along the horizontal rail. On the wide black textured build plate below it stands a half-finished yellow object, its outer wall built from dozens of fine horizontal lines stacked one on top of the next, the topmost line still faintly glossy. A calm, warm, mid-range female narrator with an unhurried, evenly paced delivery and a neutral English accent (S1) says in an off-screen voiceover, <d>[English] 3D printing builds a solid object by adding material, layer by layer.</d> The camera pushes in slowly toward the build plate at small amplitude while the line is spoken. The carriage reaches the end of its travel, reverses, and lays another pass, and the object grows by one visible layer. Above, the yellow reel turns a few degrees on its holder and the pale strand twitches.

      overall_soundscape: Quiet room tone throughout. The steady hum of a small cooling fan, the soft whirr of stepper motors changing direction, a faint rhythmic click from the belt at each end of a pass, and the light tick of a gear pulling filament.

      non_diegetic_music: A soft sustained warm-pad chord with a sparse marimba figure at a slow tempo, calm and unobtrusive, holding an even dynamic under the whole shot.

  # -------------------------------------------------------------------------
  # 2. How FDM works.
  # -------------------------------------------------------------------------
  # The closest shot in the film. The chained frame from scene 1 is the same
  # machine one push-in later, so <Picture 1> is a genuine composition anchor
  # here and not just an identity carrier.
  - id: how-fdm-works
    prompt: |-
      subject_definitions:
      <Subject 1> is the black print head in <Picture 1> and <Picture 3>, a compact carriage with a black axial cooling fan at its centre and a small brass nozzle in a discoloured heater block below it, with a pale strand of filament entering it from above.
      <Subject 2> is the half-finished yellow object on the wide black textured build plate in <Picture 1> and <Picture 2>, its outer wall built from fine horizontal lines stacked one on top of the next.

      summary:
      [reference generation] The target video is an extreme macro shot of <Subject 1> drawing a bead of melted plastic across the top of <Subject 2>, the bead cooling and fusing onto the layer beneath it, while an off-screen narrator explains how the nozzle works. <Picture 1> supplies the framing and the part; <Picture 2> supplies the build plate; <Picture 3> supplies the print head in detail.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the black carriage, black axial cooling fan, small brass nozzle, discoloured heater block, and the filament strand entering from above are retained, seen much closer than in the reference.
      <Subject 2> (appears in [Shot 1]): partially_preserved - the yellow plastic and the fine stacked horizontal layer lines are retained; only the top few millimetres of the object are in frame and the rest is out of shot.

      detailed_description:
      The target video is photorealistic live-action footage, clean and technical, lit by soft even indoor light, with very shallow depth of field and fine film grain.
      [Shot 1] An extreme macro shot sits level with the build plate, close enough that the small brass nozzle and discoloured heater block of <Subject 1> fill the left of the frame while the black axial cooling fan above falls out of focus. A pale strand of filament runs down into the carriage from the top of frame and twitches as it is pulled in. A calm, warm, mid-range female narrator with an unhurried, evenly paced delivery and a neutral English accent (S1) says in an off-screen voiceover, <d>[English] The nozzle melts plastic filament and draws every layer onto the plate.</d> As the line begins, the nozzle is already moving steadily to the right, and a continuous soft bead of molten yellow plastic emerges from its tip and settles onto the top surface of <Subject 2>. The bead sits proud and glossy for a moment, then dulls as it cools and fuses flat against the fine horizontal line beneath it. The camera holds a static macro shot and tracks a short distance right with the nozzle at slow speed. A faint shimmer of heat rises off the tip.

      overall_soundscape: Quiet room tone throughout. The close steady hum of the cooling fan, the fine whirr of a stepper motor holding an even speed, the light regular tick of the extruder gear feeding filament, and a faint crackle as hot plastic contacts the layer below.

      non_diegetic_music: A soft sustained warm-pad chord with a sparse marimba figure at a slow tempo, calm and unobtrusive, holding an even dynamic under the whole shot.

  # -------------------------------------------------------------------------
  # 3. Filament.
  # -------------------------------------------------------------------------
  # The camera leaves the nozzle for the spools, so the chained frame is only
  # good for the light and colour - labelling it honestly is what stops the
  # prompt from asking for a nozzle macro it has just left. The two reels are the
  # ones actually on the machine, so this shot is anchored rather than invented.
  - id: filament-pla
    prompt: |-
      subject_definitions:
      <Subject 1> is the black printed spool holder above the machine in <Picture 2>, carrying two wide reels wound in neat side-by-side turns, one dark graphite grey and one yellow, with a single pale strand feeding down from the yellow reel.
      <Subject 2> is the black print head and its filament intake in <Picture 1> and <Picture 3>, the compact carriage the strand runs down into.
      <Subject 3> is the desk workspace in <Picture 2>, with a light plywood work surface, a deep teal-blue wall behind, and soft even indoor lighting.

      summary:
      [reference generation] The target video follows the strand of <Subject 1> from the turning yellow reel down into <Subject 2>, against the teal wall of <Subject 3>, while an off-screen narrator introduces PLA. <Picture 2> supplies the spool holder and the machine; <Picture 3> supplies the print head; <Picture 1> supplies the lighting and colour continuing from the previous shot.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the black printed holder, the two wide reels in dark graphite grey and yellow, their neat side-by-side winding, and the feeding strand are retained.
      <Subject 2> (appears in [Shot 1]): partially_preserved - the black carriage and the filament intake are retained; the nozzle and build plate are below the frame.
      <Subject 3> (appears in [Shot 1]): weak_reference - only the light plywood surface, deep teal-blue wall, and soft even indoor lighting are carried over; the framing is new.

      detailed_description:
      The target video is photorealistic live-action footage, clean and technical, lit by soft even indoor light, with shallow depth of field and fine film grain.
      [Shot 1] A close shot frames the top of the machine against the deep teal-blue wall of <Subject 3>, with <Subject 1> filling the upper frame - two wide reels on the black printed holder, one dark graphite grey and one yellow, wound in neat side-by-side turns. The yellow reel rotates slowly. Its pale strand leaves the winding, arcs down across the frame, and runs into the filament intake of <Subject 2> at frame right. A calm, warm, mid-range female narrator with an unhurried, evenly paced delivery and a neutral English accent (S1) says in an off-screen voiceover, <d>[English] PLA is the easiest filament to start with, in almost any color.</d> The camera drifts slowly down along the strand at small amplitude, keeping the arc of filament in focus while the reels soften behind it. The strand jumps very slightly as the intake pulls it, one loose turn settles against the reel, and the yellow reel turns another few degrees.

      overall_soundscape: Quiet room tone throughout. The steady hum of a cooling fan a short distance away, the faint squeak of a reel turning on its holder, the light regular tick of the extruder gear pulling filament, and a soft rustle as the strand shifts against the winding.

      non_diegetic_music: A soft sustained warm-pad chord with a sparse marimba figure at a slow tempo, calm and unobtrusive, holding an even dynamic under the whole shot.

  # -------------------------------------------------------------------------
  # 4. PETG and ABS.
  # -------------------------------------------------------------------------
  # Hands only - no face. Both objects are the finished prints already sitting on
  # the desk in <Picture 2>, which is the strongest use the anchor gets outside
  # the machine itself. The line covers two materials in twelve words, so the
  # visual carries the contrast - one translucent and glossy, one matte and
  # opaque - rather than trying to name them again.
  - id: petg-and-abs
    prompt: |-
      subject_definitions:
      <Subject 1> is the translucent amber-yellow printed fish figure standing on the desk in <Picture 2>, glossy, with fine horizontal layer lines running across its curved body.
      <Subject 2> is the dark faceted printed vase standing on the desk in <Picture 2>, matte and opaque, its surface broken into angular panels stepped in fine horizontal layer lines.
      <Subject 3> is the desk 3D printer in <Picture 2>, with its matte black open frame, bright orange printed brackets, and polished steel lead screws, running a print in the background.
      <Subject 4> is the close-focus treatment of <Picture 1> and <Picture 3> - soft even indoor light, very shallow depth of field, and fine film grain.

      summary:
      [reference generation] The target video is a close shot of a pair of hands turning <Subject 1> in the light above the plywood desk and then turning <Subject 2> beside it, with <Subject 3> working out of focus behind, while an off-screen narrator contrasts PETG and ABS. <Picture 2> supplies both printed objects and the machine; <Picture 1> and <Picture 3> supply the macro treatment.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the translucent amber-yellow plastic, glossy finish, curved body, and fine horizontal layer lines are retained, now held in the hand.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the dark matte plastic, angular faceted panels, and stepped horizontal layer lines are retained.
      <Subject 3> (appears in [Shot 1]): partially_preserved - the matte black frame, orange printed brackets, and polished steel lead screws are retained, held soft and out of focus in the background.
      <Subject 4> (appears in [Shot 1]): weak_reference - only the soft even indoor light, very shallow depth of field, and fine grain are carried over; the subject and framing are new.

      detailed_description:
      The target video is photorealistic live-action footage, clean and technical, lit by soft even indoor light, with very shallow depth of field and fine film grain matching <Subject 4>.
      [Shot 1] A close shot frames two bare hands over the light plywood work surface, forearms entering from the bottom of frame, with no face or upper body in shot. The left hand holds <Subject 1>, the translucent amber-yellow printed fish, up into the light, its fine horizontal layer lines catching a bright highlight along one curved flank. A calm, warm, mid-range female narrator with an unhurried, evenly paced delivery and a neutral English accent (S1) says in an off-screen voiceover, <d>[English] PETG handles heat and weather better. ABS wants a warm, steady room.</d> As the line begins the left hand is already rotating the figure slowly, and the highlight travels across the ridged surface while light passes through the amber plastic. The right hand then reaches to <Subject 2>, the dark faceted vase standing on the desk, and turns it a quarter turn; its matte angular panels catch almost no highlight at all. Behind both, well out of focus, <Subject 3> continues working. The camera holds a static close shot.

      overall_soundscape: Quiet room tone throughout. The muffled hum of the printer working behind, the dry scrape of hard plastic turning against skin, a hollow scuff as the vase pivots on the plywood, and the light regular click of a print head changing direction in the background.

      non_diegetic_music: A soft sustained warm-pad chord with a sparse marimba figure at a slow tempo, calm and unobtrusive, holding an even dynamic under the whole shot.

  # -------------------------------------------------------------------------
  # 5. Multi-material.
  # -------------------------------------------------------------------------
  # Three beats - finish a colour, purge at the tower, resume - which is why it
  # gets the extra frames. The chained frame is a hands-and-prints close-up, so
  # it can only carry the light; the print head comes from the anchor instead.
  # The colour change is yellow to graphite grey, the two reels actually loaded.
  - id: multi-material
    video_frames: 100         # ~4.17s - a purge cycle needs the room
    prompt: |-
      subject_definitions:
      <Subject 1> is the black print head in <Picture 3>, a compact carriage with a black axial cooling fan at its centre and a small brass nozzle in a discoloured heater block below it.
      <Subject 2> is the wide flat black textured build plate of the machine in <Picture 2>, with a low part standing on it built from fine stacked horizontal layer lines.
      <Subject 3> is the close-focus treatment of <Picture 1> - soft even indoor light, very shallow depth of field, and fine film grain.

      summary:
      [reference generation] The target video shows <Subject 1> finishing a pass in yellow on <Subject 2>, tracking sideways to a small hollow square purge tower at the edge of the plate, extruding a short worm of the old colour into it, then returning and resuming the part in dark graphite grey, while an off-screen narrator explains multi-colour printing. <Picture 3> supplies the print head; <Picture 2> supplies the build plate; <Picture 1> supplies the lighting and grain.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the black carriage, black axial cooling fan, and small brass nozzle in its discoloured heater block are retained.
      <Subject 2> (appears in [Shot 1]): partially_preserved - the wide black textured build plate and the stacked horizontal layer lines are retained; the machine's frame and lead screws are outside the frame.
      <Subject 3> (appears in [Shot 1]): weak_reference - only the soft even indoor light, shallow depth of field, and fine grain are carried over; the subject and framing are new.

      detailed_description:
      The target video is photorealistic live-action footage, clean and technical, lit by soft even indoor light, with shallow depth of field and fine film grain matching <Subject 3>.
      [Shot 1] A close overhead-angled shot looks down across <Subject 2>, the wide black textured build plate, with a low yellow part built from fine stacked horizontal layer lines at frame left and a small hollow square tower of scrap plastic standing alone at frame right. <Subject 1>, the black carriage with its axial cooling fan and small brass nozzle, completes a pass across the part in yellow. A calm, warm, mid-range female narrator with an unhurried, evenly paced delivery and a neutral English accent (S1) says in an off-screen voiceover, <d>[English] Some printers run several colors, purging the nozzle clean between each one.</d> While the line is spoken the carriage lifts, tracks quickly right to the square tower, and extrudes a short worm of plastic that shifts from yellow to dark graphite grey as it comes out and coils onto the tower. The carriage then tracks back left and lays a clean dark grey line across the top of the yellow part. The camera holds a static shot.

      overall_soundscape: Quiet room tone throughout. The steady hum of the cooling fan, a rising whirr as the stepper motors accelerate across the plate, a firm click at each end of the move, the fast tick of the extruder gear during the purge, and a soft crackle of hot plastic coiling onto the tower.

      non_diegetic_music: A soft sustained warm-pad chord with a sparse marimba figure at a slow tempo, calm and unobtrusive, adding one light shaker accent as the nozzle reaches the tower.

  # -------------------------------------------------------------------------
  # 6. Supports.
  # -------------------------------------------------------------------------
  # The part has to read as *unbuildable without help*, so the description leads
  # with the empty air under the ledge and only then gives it the scaffold.
  - id: supports
    prompt: |-
      subject_definitions:
      <Subject 1> is the wide flat black textured build plate and the printed part standing on it in <Picture 1> and <Picture 2>, built from fine stacked horizontal layer lines.
      <Subject 2> is the black print head in <Picture 1> and <Picture 3>, a compact carriage with a black axial cooling fan at its centre and a small brass nozzle in a discoloured heater block below it.

      summary:
      [reference generation] The target video is a low close shot along <Subject 1> of a yellow part with a wide horizontal ledge jutting out into empty air, held up from below by a lattice of thin sacrificial columns, with <Subject 2> laying the underside of the ledge, while an off-screen narrator explains why overhangs need support. <Picture 1> supplies the plate and the print in progress; <Picture 2> supplies the machine; <Picture 3> supplies the print head.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the wide black textured build plate and the fine stacked horizontal layer lines are retained; the part's shape is new.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the black carriage, black axial cooling fan, and small brass nozzle in its discoloured heater block are retained.

      detailed_description:
      The target video is photorealistic live-action footage, clean and technical, lit by soft even indoor light, with shallow depth of field and fine film grain.
      [Shot 1] A low close shot sits almost level with <Subject 1>, the wide black textured build plate, looking along its surface. A yellow printed part rises from the plate and then juts sideways into a wide flat ledge that hangs out over nothing. Beneath that ledge stands a lattice of thin, widely spaced sacrificial columns in the same yellow plastic, visibly flimsier and more loosely built than the part above them. A calm, warm, mid-range female narrator with an unhurried, evenly paced delivery and a neutral English accent (S1) says in an off-screen voiceover, <d>[English] Overhangs need supports, or the plastic has nothing underneath to print onto.</d> As the line begins, <Subject 2> is already drawing a line across the underside of the ledge, bridging from the top of one thin column to the next. The camera tracks slowly left along the plate at small amplitude, so the eye follows the scaffold from column to column under the ledge. A short strand of plastic droops between two columns and stops.

      overall_soundscape: Quiet room tone throughout. The steady hum of the cooling fan, the fine whirr of stepper motors, a light regular tick from the extruder gear, and a faint crackle as each fresh line cools against the one below.

      non_diegetic_music: A soft sustained warm-pad chord with a sparse marimba figure at a slow tempo, calm and unobtrusive, holding an even dynamic under the whole shot.

  # -------------------------------------------------------------------------
  # 7. Maintenance.
  # -------------------------------------------------------------------------
  # The machine is idle and cool here, which is the point - it is the only shot
  # with nothing moving. Hands only again. The three beats map to the three items
  # in the line: brush the nozzle, gap-check the first layer with a sheet of
  # paper, turn the orange knob on the control box for the firmware. The knob is
  # in <Picture 2>, so "firmware" gets a real object instead of a caption.
  - id: maintenance
    prompt: |-
      subject_definitions:
      <Subject 1> is the desk 3D printer in <Picture 2>, with its matte black open frame, bright orange printed brackets, polished steel lead screws, and wide flat black textured build plate, standing idle with nothing printing.
      <Subject 2> is the black print head in <Picture 1> and <Picture 3>, a compact carriage with a black axial cooling fan at its centre and a small brass nozzle in a discoloured heater block below it.
      <Subject 3> is the small black control box in <Picture 2>, standing on the plywood desk in front of the machine, with a dark rectangular screen and a round orange knob beside it.

      summary:
      [reference generation] The target video is a close shot of a pair of hands maintaining <Subject 1> while it sits idle - brushing the cooled tip of <Subject 2> with a small wire brush, sliding a sheet of paper under the nozzle to check the gap to the plate, then turning the orange knob on <Subject 3> - while an off-screen narrator lists the routine upkeep. <Picture 2> supplies the machine, the workspace, and the control box; <Picture 3> and <Picture 1> supply the print head.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): partially_preserved - the matte black frame, orange printed brackets, and wide black textured build plate are retained; the machine is idle and seen much closer, so most of it is outside the frame.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the black carriage, black axial cooling fan, and small brass nozzle in its discoloured heater block are retained.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the small black box, its dark rectangular screen, and the round orange knob are retained.

      detailed_description:
      The target video is photorealistic live-action footage, clean and technical, lit by soft even indoor light, with shallow depth of field and fine film grain.
      [Shot 1] A close shot frames <Subject 2> parked motionless above the wide black textured build plate of <Subject 1>, everything still, the plate bare and the machine dark. Two bare hands enter from the bottom of the frame, forearms only, with no face or upper body in shot. A calm, warm, mid-range female narrator with an unhurried, evenly paced delivery and a neutral English accent (S1) says in an off-screen voiceover, <d>[English] Keep the nozzle clear, level the first layer, and update the firmware.</d> As the line begins, the right hand is already working a small brass wire brush back and forth across the cooled brass nozzle, and a few crumbs of dark hardened plastic drop away onto the plate. The left hand then slides a single sheet of white paper flat onto the build plate and draws it slowly under the nozzle until it catches and drags very slightly. The camera pans down at slow speed and small amplitude to <Subject 3> on the plywood desk, where the right hand turns the round orange knob a click and the dark screen beside it lights with a soft pale glow carrying no readable words.

      overall_soundscape: Quiet room tone throughout, with no motor noise at all - the machine is idle. Fine wire bristles scratch across metal, small hard flakes tick onto the plate, a sheet of paper slides and rasps against the bed surface, and a single firm detent clicks as the knob turns.

      non_diegetic_music: A soft sustained warm-pad chord with a single sparse marimba note, calm and unobtrusive, thinning almost to silence and landing one quiet note on the click of the knob.

  # -------------------------------------------------------------------------
  # 8. The software.
  # -------------------------------------------------------------------------
  # The closer, and the one scene with a screen in it. The UI is described by
  # appearance only - never named, never given readable words - for the same
  # reason josy-house-party's chat app was: legible text is not something this
  # model can be trusted to draw. The monitor is not in either anchor, so the
  # chained frame and both photos can only carry the room and the light.
  - id: slicer-software
    video_frames: 100         # ~4.17s - the closing line plus a slice sweep
    prompt: |-
      subject_definitions:
      <Subject 1> is the desk 3D printer in <Picture 2>, with its matte black open frame, bright orange printed brackets, and polished steel lead screws, running a print in the background.
      <Subject 2> is the desk workspace in <Picture 2>, with a light plywood work surface, a deep teal-blue wall behind, and soft even indoor lighting.
      <Subject 3> is the close-focus treatment of <Picture 1> and <Picture 3> - soft even indoor light, shallow depth of field, and fine film grain.

      summary:
      [reference generation] The target video frames a monitor standing on the plywood desk of <Subject 2> beside <Subject 1>, its screen showing a dark three-dimensional viewport in which a pale model is sliced into stacked horizontal bands and a coloured toolpath sweeps across one layer, while an off-screen narrator closes on what slicing software does. <Picture 2> supplies the machine and the workspace; <Picture 1> and <Picture 3> supply the lighting and grain only, since the monitor is new.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): partially_preserved - the matte black frame, orange printed brackets, and polished steel lead screws are retained, held soft and out of focus behind the monitor.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the light plywood work surface, deep teal-blue wall, and soft even indoor lighting are retained.
      <Subject 3> (appears in [Shot 1]): weak_reference - only the soft even indoor light, shallow depth of field, and fine grain are carried over; the monitor, the screen content, and the framing are all new.

      detailed_description:
      The target video is photorealistic live-action footage, clean and technical, lit by soft even indoor light, with shallow depth of field and fine film grain matching <Subject 3>.
      [Shot 1] A close shot frames a monitor standing on the plywood work surface of <Subject 2>, angled slightly toward the camera, its screen filling most of the frame. The screen shows a dark grey three-dimensional viewport with a faint grid floor and a pale grey model of a simple object standing at its centre, with a narrow vertical slider bar down one side and a thin progress bar along the bottom. No readable words or letters appear anywhere on the screen. A calm, warm, mid-range female narrator with an unhurried, evenly paced delivery and a neutral English accent (S1) says in an off-screen voiceover, <d>[English] Slicing software turns your model into the path the printer follows.</d> As the line begins, a horizontal plane is already sweeping upward through the model, and everything below it resolves into dozens of stacked flat bands. A single bright orange looping toolpath then draws itself across one exposed band from the outside inward. Behind the monitor, well out of focus, <Subject 1> continues working against the teal-blue wall. The camera pushes in very slowly at small amplitude.

      overall_soundscape: Quiet room tone throughout. The muffled hum and periodic click of the printer working out of focus behind, the faint electrical whine of a monitor, and two soft mouse clicks close to the microphone.

      non_diegetic_music: A soft sustained warm-pad chord with a sparse marimba figure at a slow tempo, calm and unobtrusive, resolving onto one final settled chord as the toolpath completes.
