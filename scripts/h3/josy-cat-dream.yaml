# josy-cat-dream - an eight-scene short, told entirely in first person from the
# couch behind her. Josy walks the top of the couch backrest the way a cat walks
# a fence, reaches the arm and folds into a loaf with her back to us. While she
# lies there she changes: the coat goes plush, the bat ears shrink to small
# triangles, a long tail unfurls out of her stump. A woman's voice off-screen
# asks "Josy?" She gets up, turns round fully a black cat, sits on the arm and
# washes her paw, then loafs again to sleep. Cut: she wakes on the same couch,
# down in the seat, sprawled on her side - an ordinary dog. It was her dream.
#
#   ./moviemakr.py render scripts/h3/josy-cat-dream.yaml --dry-run
#   ./moviemakr.py render scripts/h3/josy-cat-dream.yaml --only 1
#   ./moviemakr.py render scripts/h3/josy-cat-dream.yaml
#   ./moviemakr.py status scripts/h3/josy-cat-dream.yaml
#
# Prompts are written through the `h3-prompt-writing` skill in full-reference
# (Ref2VA) form - see .claude/skills/h3-prompt-writing/references/ref-en.txt.
# Same two adaptations as scripts/h3/josy-bat-dream.yaml, because moviemakr
# generates one shot per docker run rather than a whole movie:
#
#   1. Every scene is a single [Shot 1] with no cut timestamp. The cuts in this
#      story happen between docker runs, not inside them.
#   2. detailed_description runs ~200-250 words, not the guide's 350-500. That
#      range is for a full multi-shot video; one ~4.5-second shot carries far
#      less information. This file sits in the range its siblings measure at
#      (josy-beach-drive 201-245, josy-bat-dream 197-250).
#
# ---------------------------------------------------------------------------
# SCENE BREAKDOWN - the draft's four beats over eight scenes
# ---------------------------------------------------------------------------
# video_frames is 100 everywhere, which sd-cli rounds to 107 (~4.46s), so the
# only way to give a beat more time is to give it its own scene. Three of the
# four drafted beats carry more action than one shot can hold:
#
#   draft 1 (walks the couch, loafs on the arm) -> 1  on-the-backrest
#                                               -> 2  the-loaf
#   draft 2 (ears change, tail grows, "JOSY?")  -> 3  her-ears-change
#                                               -> 4  the-tail
#   draft 3 (gets up, turns, washes, loafs)     -> 5  turning-around
#                                               -> 6  washing
#                                               -> 7  the-cat-loaf
#   draft 4 (wakes, laying properly like a dog) -> 8  waking
#
# Why each split is where it is:
#
#   1|2  A walk along a narrow backrest is a sustained motion, not an event;
#        it needs the whole shot to read as deliberate and cat-like rather than
#        as a dog scrambling. The circle-and-fold onto the arm is a separate
#        event and gets its own shot.
#   3|4  The morph is the film. Packing ears AND tail into 4.5s is how a
#        transformation turns into a dissolve you cannot see. Splitting also
#        buys the right ordering: the ears go first because they are the silent
#        change, and the tail lands with the line on top of it.
#   5|6|7 Three distinct cat gestures - the turn (the reveal), the paw wash,
#        the settle. Any two of them in one shot and the reveal gets stepped on.
#
# Draft 4 stays one scene. It is the densest shot in the film (wake, head up,
# look at the empty arm, relief, settle) and it survives at 107 frames for the
# same reason josy-bat-dream's scene 10 does: the camera never moves and every
# beat is a head or an eyelid.
#
# 100 is the ceiling, not a starting point: at 544x960 on this box 90 stays 90,
# 100 becomes 107, and 110 becomes 124 - which takes the GPU out with
# DeviceLost at the VAE stage (see scripts/h3/butterfly-dream.yaml). Check the
# "generate_video 544x960xN" line in the log for what you actually got.
#
# ---------------------------------------------------------------------------
# THE <Picture N> CONTRACT - read before editing any prompt
# ---------------------------------------------------------------------------
# Refs reach sd-cli as: chained previous frame first (render() inserts it at
# index 0), then continuity.anchors in order, then the scene's own ref_images.
# With one anchor, that fixes the labels as:
#
#   scene 1 (chain off, 1 scene ref):
#     <Picture 1> = assets/josy-reference.jpg
#     <Picture 2> = assets/josy-couch.jpg
#
#   scene 2 (chained, 1 scene ref):
#     <Picture 1> = the previous scene's last frame
#     <Picture 2> = assets/josy-reference.jpg
#     <Picture 3> = assets/josy-couch.jpg
#
#   scenes 3-7 (chained, no scene refs):
#     <Picture 1> = the previous scene's last frame
#     <Picture 2> = assets/josy-reference.jpg
#
#   scene 8 (chain off, 1 scene ref):
#     <Picture 1> = assets/josy-reference.jpg
#     <Picture 2> = assets/josy-couch.jpg
#
# If you flip chain_from_previous on any scene, every label in it shifts by one.
#
# Two scenes deliberately break the chain:
#   scene 1  - nothing to chain from.
#   scene 8  - this is the cut from dream to waking. Chaining scene 7's sleeping
#              black cat into the shot that exists to prove there was never a
#              cat is how half a whisker survives into the ending. josy-couch
#              restates the room from a clean plate instead, which is also what
#              makes 8 rhyme with 1 on screen.
#
# <Subject N> numbering is per scene, in order of first appearance, as the guide
# specifies, so the same dog is <Subject 1> in every scene here but the woman
# behind the camera is <Subject 3> in scene 1 and <Subject 4> in scene 4. That
# is correct - each scene is an independent generation.
#
# retention_analysis only carries lines for reference-backed labels, per the
# guide's "one line for each reference label". The woman is invented outright -
# no picture defines her - so she gets a subject_definitions entry and no
# retention line. Do not invent a marker for her; fully_preserved against
# nothing is what makes the model start hunting for her in the anchor.
#
# ---------------------------------------------------------------------------
# THE ROOM - josy-couch.jpg is a scenario plate, not a character plate
# ---------------------------------------------------------------------------
# The photo is the exact framing this film needs and almost nothing else: a
# seated viewpoint immediately behind a pale grey fabric corner couch, looking
# along the top of its backrest, with the room laid out beyond - a wall-mounted
# flat-screen television on a plain pale grey wall, a slim black soundbar on a
# shelf below it, a dark wood console table underneath, a blue upholstered
# armchair at the left, a tall glazed garden door further left, pale tiled
# flooring, soft warm indoor daylight.
#
# Two things in that photo must NOT come through, and every prompt that uses it
# says so in the retention line:
#
#   - the person seated in the blue armchair at the left edge. The woman whose
#     eyes we occupy is the only other presence in this film and she is behind
#     the camera. A second body in the frame kills the first-person read.
#   - the harness Josy wears in it. She is bare-coated here, defined by
#     josy-reference.jpg, which is why the plate is marked partially_preserved
#     for the room and the couch only.
#
# What the plate IS allowed to give her is her *position* - up on the backrest,
# side on to the lens. That is the shot, and it is already in the photo.
#
# ---------------------------------------------------------------------------
# THE CAT - invented, but anchored
# ---------------------------------------------------------------------------
# There is no black-cat reference in assets/ and none is added. The cat is
# still not a free invention: it is Josy, so scenes 5-7 mark josy-reference
# partially_preserved and name exactly what survives the morph and what does
# not.
#
#   retained     - the petite finely-boned build, the slender neck and light
#                  delicate frame, the near-black coat, the white chest blaze,
#                  the wide round dark eyes.
#   not retained - the flat deeply wrinkled brachycephalic muzzle (becomes a
#                  short wedge muzzle with long white whiskers), the large
#                  upright bat ears (become small triangular cat ears set
#                  forward on the skull), the stump tail (becomes a long tail
#                  the length of her body), the short smooth coat (becomes a
#                  dense plush pile).
#
# The white chest blaze is the load-bearing one. It is what lets an audience
# read the cat in scene 5 as *her* rather than as a cat that wandered in, and
# it is the only thing carried unbroken across all eight scenes. Do not drop it
# from the cat scenes to make the black read cleaner.
#
# ---------------------------------------------------------------------------
# THE MORPH IS SHOT FROM BEHIND - do not "improve" this
# ---------------------------------------------------------------------------
# Scenes 2-4 keep her back to the lens and her face out of sight, exactly as
# drafted. That is not a limitation, it is the mechanism: the ears and the tail
# are the two parts of a dog that a cat most obviously is not, and both read in
# silhouette from behind. Turning her round early spends the reveal in scene 5
# before it arrives, and gives the model a face to morph in mid-shot - which is
# where this kind of generation smears. Scene 5 is the first frame of her face
# in four scenes, and it should be the whole cat at once.
#
# ---------------------------------------------------------------------------
# THE LINE - one word, and it is the only speech in the film
# ---------------------------------------------------------------------------
# "Josy?" rather than the drafted "JOSY?": the guide standardises decorative
# capitalisation and punctuation inside <d>, so the curiosity rides in the
# delivery description instead ("curious rather than alarmed, rising on the
# second syllable"). It lands in scene 4, over the tail, and nowhere else -
# every other scene's overall_soundscape ends "No speech." Note (S1) is the
# speaker ID, assigned by order of vocal events in the target video; it is
# unrelated to <Subject 1> and only ever appears on her.
#
# ---------------------------------------------------------------------------
# KEEPING HER FEMALE - don't drop these when editing
# ---------------------------------------------------------------------------
# Carried over from scripts/h3/josy-house-party.yaml, where an early take
# rendered a male dog despite a dozen "she"s. Grammatical gender is weak
# conditioning for this model, and a negative prompt cannot fix it (cfg_scale is
# 1.0, so CFG is off and negative_prompt is never evaluated). What carries it:
# build, not pronouns - "small, compact, petite, narrow finely-boned head,
# slender neck, light delicate frame", restated in BOTH subject_definitions and
# at her first appearance in detailed_description, per the guide's rule. It is
# restated in the cat scenes too: the morph changes her body, and dropping the
# build language there is how she comes back male in scene 8.
name: josy-cat-dream

model:
  root: /home/erika/Projects/ai-models          # host dir, mounted read-only at /models
  diffusion_model: minimax-h3/minimax_h3_ref2va_pruned-Q8_0.gguf
  llm:             minimax-h3/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  vae:             minimax-h3/minimax_h3_video_vae_fp16.safetensors
  audio_vae:       minimax-h3/minimax_h3_audio_vae_fp32.safetensors

docker:
  image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan
  devices: [/dev/dri/card1, /dev/dri/renderD128, /dev/kfd]
  # Your UID owns the GPU device ACLs, so the container can drop root and still
  # reach the GPU - which keeps rendered clips owned by you instead of root.
  run_as_current_user: true

defaults:
  # Portrait, as every other script in scripts/h3/. josy-couch.jpg is a
  # landscape photo, so every scene holds its camera *angle* - seated eye
  # height, immediately behind the backrest, looking along it - rather than
  # its crop.
  width: 544
  height: 960
  fps: 24
  # ~4.46s. sd-cli rounds this UP, and not by one or two: measured on this box
  # at 544x960, 90 stays 90, 100 becomes 107, 110 becomes 124. 100 is the
  # ceiling - 124 frames is a DeviceLost at the VAE stage, not a slow render.
  video_frames: 100
  cfg_scale: 1.0
  seed: 42
  negative_prompt: ""       # no effect at cfg_scale 1.0 - CFG is off, so the
                            # negative prompt is never evaluated. Steer with
                            # positive description instead.
  # MUST stay empty for H3-structured prompts. full_prompt() appends the suffix
  # as ". <suffix>" at the very end - which here is the end of
  # non_diegetic_music, so the style text would read as part of the score. The
  # look lives in each scene's detailed_description opening line instead.
  style_suffix: ""
  # --mmap matters: ~39 GB of weights reload on every scene, and the page cache
  # keeps them warm between runs. The VAE stays on the GPU on purpose -
  # "--backend vae=cpu" made the audio decode at the end of each scene slower.
  extra_args: ["--diffusion-fa", "--mmap", "--backend", "te=cpu"]

continuity:
  # One anchor, passed to every scene: the clean full-body shot that fixes her
  # build, coat, white chest blaze and bat ears. The cat scenes get it too and
  # want it - it is the thing they are marked partially_preserved *against*,
  # and it is where the white blaze comes from on the cat.
  anchors:
    - josy-reference.jpg

  # Reference *videos* stay empty on purpose: on this box a --ref-video either
  # crashes the GPU with DeviceLost or drags the whole pipeline onto the CPU.
  # Reference images do not - chaining has always used them.
  anchor_videos: []

  chain_from_previous: true

output:
  container: mp4             # mp4 (h264/aac) or webm (vp9/opus)
  audio: keep                # keep the model's generated audio, or "strip"
  music: null                # optional file under assets/, mixed under the movie
  music_gain_db: -18

scenes:
  # =========================================================================
  # DRAFT SCENE 1 - she walks the couch and loafs on the arm
  # =========================================================================

  # -------------------------------------------------------------------------
  # 1. On the backrest.
  # -------------------------------------------------------------------------
  # The only scene with chaining off at the front, so the labels here are
  # anchor-then-scene-ref. It has to establish three things at once - the
  # first-person seated camera, the room, and her already up on the backrest -
  # so the only action is the walk. She never looks back at the lens; that
  # withheld face is what scenes 2-4 are built on and scene 5 pays off.
  - id: on-the-backrest
    chain_from_previous: false
    ref_images:
      - josy-couch.jpg
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1>: compact and petite, with a narrow finely-boned head, a slender neck, and a light delicate frame, a short dark brindle coat that reads almost black, faint lighter brindle striping along her flanks, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, a short deeply wrinkled muzzle, a flat black nose, and a short stump of a tail. She wears no harness, collar or clothing of any kind.
      <Subject 2> is the living room and couch in <Picture 2>: a large pale grey fabric corner couch seen from directly behind, its padded backrest running away across the frame with a broad flat arm at the right, standing in a bright domestic living room with a wall-mounted flat-screen television on a plain pale grey wall, a slim black soundbar on a shelf below it, a dark wood console table underneath, a blue upholstered armchair at the left, a tall glazed garden door further left, and pale tiled flooring under soft warm indoor daylight.
      <Subject 3> is the woman whose eyes the camera occupies. She is never seen; the frame is her point of view, at the eye height of an adult sitting on a second couch immediately behind the first, and no part of her enters the frame.

      summary:
      [reference generation] The target video is a first-person shot from the seated viewpoint of <Subject 3>, looking at the back of <Subject 2>: <Subject 1> steps up onto the top of the padded backrest and walks along it away from the camera toward the arm at the right, placing one paw in front of the other the way a cat walks a fence. <Picture 1> supplies her build and coat, <Picture 2> the couch, the room and the camera position.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the petite finely-boned build, near-black brindle coat with faint lighter striping, white chest blaze, large upright bat ears, wide round dark eyes, short wrinkled muzzle and stump tail of <Picture 1> are retained, as is her bare coat with no harness.
      <Subject 2> (appears in [Shot 1]): partially_preserved - the pale grey corner couch, its padded backrest and broad flat arm, the seated viewpoint behind it, the television wall, soundbar, dark console table, blue armchair, glazed garden door, tiled flooring and soft warm daylight of <Picture 2> are retained, as is the dog's position up on the backrest; the person seated in the blue armchair at the left edge of <Picture 2> is not retained and the room holds no people at all, and the patterned harness worn by the dog in <Picture 2> is not retained.

      detailed_description:
      The target video is photorealistic live-action footage in a natural handheld first-person style, shot on a wide lens at seated eye height immediately behind the couch in soft warm indoor daylight, with a shallow depth of field and fine film grain.
      [Shot 1] The frame opens on the back of <Subject 2> filling the lower half of the picture, the pale grey weave of the backrest running away to the right toward its broad flat arm, the room laid out beyond it - the flat-screen television on the grey wall, the dark console table beneath, the blue armchair at the left, the glazed garden door further off. The camera sways faintly with the breathing of <Subject 3> and does not move otherwise. <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze and large upright bat ears, rises into frame as she steps up onto the top of the backrest from the seat below, and straightens. She is side on, close, filling a third of the frame. She begins to walk along the narrow padded ridge away from the camera and toward the arm, setting one forepaw carefully down in front of the other the way a cat crosses a fence, her shoulder blades rolling under her near-black coat, her hindquarters swinging to hold the line, her stump tail level. Her blunt claws catch and release the woven fabric. She looks straight ahead and never once glances back.

      overall_soundscape: Quiet domestic living-room tone throughout, close and slightly padded, with a faint electrical hum from the television standby and a soft muffled street murmur beyond the glazed door. Blunt claws pressing and releasing woven upholstery fabric in a slow four-beat rhythm, the padding compressing under her weight, and light snuffling flat-faced breathing carrying from a few feet away. Slow quiet breathing close on the microphone from behind the lens. No speech.

      non_diegetic_music: A quiet unhurried fingerpicked acoustic guitar figure at a slow tempo, warm and domestic, with a single soft sustained cello note underneath, holding an even dynamic and following her walk without hurrying it.

  # -------------------------------------------------------------------------
  # 2. The loaf.
  # -------------------------------------------------------------------------
  # The arrival and the fold, and the last shot of her as a dog. josy-couch is
  # passed again here rather than left to the chain: everything from scene 3 on
  # rides on the geometry of that arm, and this is the cheapest place to lock
  # it. The loaf is described as a silhouette - square, paws invisible, back to
  # the lens - because that silhouette is the canvas the whole morph plays on.
  - id: the-loaf
    ref_images:
      - josy-couch.jpg
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog established in <Picture 1> and <Picture 2>: compact and petite, with a narrow finely-boned head, a slender neck and a light delicate frame, a short near-black brindle coat, a white blaze on the centre of her chest, large upright bat ears, wide round dark eyes, a short deeply wrinkled muzzle and a stump of a tail, wearing no harness or collar.
      <Subject 2> is the living room and couch in <Picture 1> and <Picture 3>: a large pale grey fabric corner couch seen from directly behind, its padded backrest running away across the frame to a broad flat arm at the right, in a bright domestic living room with a wall-mounted flat-screen television on a pale grey wall, a slim black soundbar below it, a dark wood console table, a blue upholstered armchair at the left, a tall glazed garden door and pale tiled flooring, under soft warm indoor daylight.

      summary:
      [reference generation] The target video continues directly from <Picture 1>: <Subject 1> finishes her walk along the backrest of <Subject 2>, steps onto the broad flat arm, turns a tight half circle on the spot and folds down into a compact loaf with her paws tucked out of sight and her back to the camera. <Picture 1> supplies the exact framing and light, <Picture 2> her build and coat, <Picture 3> the couch and the room.

      retention_analysis:
      <Picture 1> ([Shot 1] opening frame): fully_preserved - the first-person seated framing behind the backrest, her position and scale on it, the room beyond and the soft warm daylight are retained from the first frame onward.
      <Subject 1> (appears in [Shot 1]): fully_preserved - the petite finely-boned build, near-black brindle coat, white chest blaze, large upright bat ears, short wrinkled muzzle and stump tail are retained; her face is turned away from the camera for the whole shot.
      <Subject 2> (appears in [Shot 1]): partially_preserved - the pale grey corner couch, its backrest and broad flat arm, the television wall, console table, blue armchair, glazed door and tiled flooring of <Picture 3> are retained; the person at the left edge of <Picture 3> is not retained and the room holds no people.

      detailed_description:
      The target video is photorealistic live-action footage in a natural handheld first-person style, shot on a wide lens at seated eye height immediately behind the couch in soft warm indoor daylight, with a shallow depth of field and fine film grain.
      [Shot 1] The shot opens exactly on <Picture 1>: the seated first-person view along the backrest of <Subject 2>, with <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck and large upright bat ears, mid-stride on the padded ridge with her back to the lens. She takes two more careful paces and steps down onto the broad flat top of the couch arm, the pale grey weave giving softly under her paws. She stops. She turns a slow tight half circle on the spot, claws pulling little ridges in the fabric, and comes to rest square to the arm with her hindquarters toward the camera and her head facing away into the room. Then she folds: her forelegs bend and slide out of sight beneath her chest, her elbows disappear, her hindquarters drop and tuck, and she settles into a compact rounded loaf, absolutely square, no paws visible anywhere beneath her. Her large bat ears stay upright above the dark silhouette. She shuffles once into the padding and goes still. She does not look round. The camera settles and stops moving.

      overall_soundscape: Quiet domestic living-room tone throughout, with a faint television standby hum and a soft muffled street murmur beyond the glazed door. Two soft padded footfalls onto denser upholstery, blunt claws dragging once across woven fabric as she turns, the dry compression of foam padding as she drops her weight into it, and a long contented flat-faced sigh out through the nose. Slow quiet breathing close on the microphone from behind the lens. No speech.

      non_diegetic_music: The quiet fingerpicked acoustic guitar figure continues at the same slow tempo, thinning to single spaced notes as she turns, and resolving onto one warm sustained cello note that holds as she settles.

  # =========================================================================
  # DRAFT SCENE 2 - the change, and the voice
  # =========================================================================

  # -------------------------------------------------------------------------
  # 3. Her ears change.
  # -------------------------------------------------------------------------
  # The first half of the morph, and the silent one. Written as a continuous
  # transformation with no cut and no camera move, because the loaf silhouette
  # has to stay pinned in exactly the same place while the parts of it change -
  # that is what makes it read as a morph rather than as a cut to a cat. The
  # independent ear rotation at the end is the tell: it is a movement no dog's
  # ear makes, and it lands before the audience has consciously named it.
  - id: her-ears-change
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog established in <Picture 1> and <Picture 2>: compact and petite, with a narrow finely-boned head, a slender neck and a light delicate frame, a short near-black brindle coat, a white blaze on the centre of her chest, large upright bat ears, wide round dark eyes and a short deeply wrinkled muzzle. In this shot she is loafed with her back to the camera and her face is never visible, and she begins to change into a small black cat.
      <Subject 2> is the living room and couch in <Picture 1>: a large pale grey fabric corner couch seen from directly behind, its padded backrest running to a broad flat arm at the right, in a bright domestic living room with a wall-mounted flat-screen television on a pale grey wall, a dark wood console table, a blue upholstered armchair at the left, a tall glazed garden door and pale tiled flooring, under soft warm indoor daylight.

      summary:
      [reference generation] The target video continues directly from <Picture 1>: <Subject 1> lies motionless in her loaf on the arm of <Subject 2> with her back to the camera, and then begins to transform - her short coat lengthening into dense plush black fur and her large upright bat ears drawing in and narrowing into small triangular cat ears that rotate independently. <Picture 1> supplies the exact framing, her silhouette and the light, <Picture 2> her build and colouring.

      retention_analysis:
      <Picture 1> ([Shot 1] opening frame): fully_preserved - the first-person seated framing, the loafed silhouette in the same position and scale on the couch arm, the room beyond and the soft warm daylight are retained from the first frame onward, and the silhouette never moves from that spot.
      <Subject 1> (appears in [Shot 1]): partially_preserved - the petite finely-boned build, slender neck, light delicate frame, near-black colouring and compact loafed posture of <Picture 2> are retained; the short smooth brindle coat becomes a dense plush even-black pile and the large upright bat ears shrink into small triangular cat ears set forward on the skull.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the pale grey couch and its broad flat arm, the television wall, console table, blue armchair, glazed garden door and tiled flooring of <Picture 1> are retained unchanged, and the room stays empty of people.

      detailed_description:
      The target video is photorealistic live-action footage in a natural handheld first-person style, shot on a wide lens at seated eye height immediately behind the couch in soft warm indoor daylight, with a shallow depth of field and fine film grain.
      [Shot 1] The shot opens exactly on <Picture 1>: the seated first-person view of <Subject 1>, the small compact female French bulldog with the narrow finely-boned head and slender neck, loafed square on the broad flat arm of <Subject 2> with her back to the lens, her large upright bat ears held high above a rounded dark shape. Nothing moves. Then the change begins so gradually it reads at first as a shift in the light. Her short smooth coat lifts and lengthens across her back and shoulders into a dense plush pile, the faint brindle striping sinking away into an even soot black that drinks the daylight. Her spine lengthens and narrows under it. Her ears, wide as her head and thin enough to glow at the edges, begin to draw inward at the base and taper at the tips, shrinking and closing to two small neat triangles set further forward and further apart on a rounder skull, their inner edges tufted with fine pale hair. The loaf never shifts position on the arm. Then one ear swivels backward on its own, holds, and turns smoothly forward again - a movement no dog's ear makes. She still does not look round.

      overall_soundscape: Quiet domestic living-room tone throughout, with a faint television standby hum and a soft muffled street murmur beyond the glazed door. The snuffling flat-faced breathing from the couch thins gradually into a silent, almost inaudible breath. A fine dry rustle of fur shifting and thickening, and one small brush of an ear against itself as it turns. Slow quiet breathing close on the microphone from behind the lens, catching and going still. No speech.

      non_diegetic_music: The warm sustained cello note bends slowly upward off its pitch and hangs unresolved, joined by a thin high shimmer of bowed strings that fades in as the coat changes, holding at a low even volume with no rhythm underneath it.

  # -------------------------------------------------------------------------
  # 4. The tail.
  # -------------------------------------------------------------------------
  # The second half of the morph, and the only speech in the film. Order
  # matters: the tail has to be fully out, lifted and hooked BEFORE the line
  # lands, or the line is a reaction to nothing. The question mark the tail
  # makes and the question the woman asks are the same shape - that rhyme is
  # deliberate, and it is why the tail curls rather than lying flat.
  - id: the-tail
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog of <Picture 2>, established in <Picture 1> as already half changed: compact and petite, with a slender neck and a light delicate frame, now covered in dense plush soot-black fur with small triangular cat ears, loafed on the couch arm with her back to the camera and her face never visible. In this shot she grows a long cat's tail.
