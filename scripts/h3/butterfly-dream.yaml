# butterfly-dream - a five-scene short: a quiet afternoon of gardening and
# pavement chalk on a roof terrace turns into the dog's flying dream, and then
# she wakes up indoors and winks at us.
#
#   ./moviemakr.py render scripts/h3/butterfly-dream.yaml --dry-run
#   ./moviemakr.py render scripts/h3/butterfly-dream.yaml --only 1
#   ./moviemakr.py render scripts/h3/butterfly-dream.yaml
#   ./moviemakr.py status scripts/h3/butterfly-dream.yaml
#
# Prompts are written through the `h3-prompt-writing` skill in full-reference
# (Ref2VA) form - see .claude/skills/h3-prompt-writing/references/ref-en.txt.
# The same two adaptations as scripts/h3/debugging.yaml apply, because moviemakr
# generates one shot per docker run rather than a whole movie:
#
#   1. Every scene is a single [Shot 1] with no cut timestamp. The cuts in this
#      story happen between docker runs, not inside them.
#   2. detailed_description runs ~150-200 words, not the guide's 350-500. That
#      range is for a full multi-shot video; the guide's own rule is to spread
#      detail by information load, and one ~4-second shot carries far less.
#
# ---------------------------------------------------------------------------
# THE <Picture N> CONTRACT - read before editing any prompt
# ---------------------------------------------------------------------------
# Refs reach sd-cli as: chained previous frame first (render() inserts it at
# index 0), then continuity.anchors in order, then the scene's own ref_images.
# This script has ONE anchor (josy-reference.jpg) and varies the third ref per
# scene, so the labels are NOT uniform across the file. Per scene:
#
#   1 planting        (chain off, 2 refs): P1 = josy-reference  P2 = josy-balcony
#   2 chalk-butterfly (chained,   3 refs): P1 = prev frame  P2 = josy-reference  P3 = josy-balcony
#   3 on-the-butterfly(chained,   3 refs): P1 = prev frame  P2 = josy-reference  P3 = josy-butterfly
#   4 taking-flight   (chained,   3 refs): P1 = prev frame  P2 = josy-reference  P3 = josy-balcony
#   5 waking          (chain off, 1 ref ): P1 = josy-reference
#
# Changing a scene's ref_images or its chain_from_previous shifts every label in
# that scene. Verify against `--dry-run`, which prints the -r order directly.
#
# Why the setting image is a per-scene ref and not a second anchor: anchors go to
# EVERY scene, and scene 5 deliberately leaves the terrace. josy-reference.jpg is
# the only image that belongs in all five, so it is the only anchor.
#
# josy-reference.jpg is doing double duty in scene 5: it is shot indoors on the
# grey non-slip mat by the patio door, so it supplies both her identity and the
# room she wakes up in - which is why scene 5 needs no second reference.
#
# <Subject N> numbering is per scene, in order of first appearance, as the guide
# specifies. The dog is <Subject 1> in scenes 1-2 and <Subject 2> in scene 3;
# that is correct, since each scene is an independent generation.
#
# ---------------------------------------------------------------------------
# THE GIRL'S FACE IS NEVER SHOWN - don't weaken these when editing
# ---------------------------------------------------------------------------
# A hard requirement of this script, and it is carried structurally rather than
# by asking for it once:
#
#   1. Every shot she is in is a HIGH ANGLE from behind or over her shoulder,
#      with her head bowed over her work and her loose wavy hair hanging forward.
#      That is also exactly how she appears in josy-balcony.jpg, so the reference
#      reinforces it instead of fighting it.
#   2. Her face being hidden is stated as a positive visible fact ("her hair
#      hangs forward and completely covers her face") in subject_definitions,
#      retention_analysis, AND detailed_description. A negative_prompt cannot
#      help here - cfg_scale is 1.0, so CFG is off and it is never evaluated.
#   3. Scene 3 is her POV, so she is out of frame entirely except for one hand.
#      Scene 4 sees her only as the top of her head from far above.
#
# ---------------------------------------------------------------------------
# KEEPING HER FEMALE - carried over from debugging.yaml / josy-house-party.yaml
# ---------------------------------------------------------------------------
# Grammatical gender is weak conditioning for this model; a dozen instances of
# "she" once still rendered a male dog. Two things carry it instead:
#
#   1. Build, not pronouns. "small, compact, petite, narrow finely-boned head,
#      slender neck, light delicate frame" - male frenchies have broader,
#      blockier skulls and thicker necks, and the model has learned that
#      dimorphism. This appears in BOTH subject_definitions and at her first
#      appearance in detailed_description.
#   2. Camera discipline. This script is riskier than debugging.yaml, where she
#      sat behind a laptop the whole time - here her whole body is in frame and
#      she is lying down in scene 1. So every scene pins the camera ABOVE her,
#      looking down at her back, and says so explicitly. Scene 1 additionally
#      stacks her hind legs and turns her spine to the camera.
#
# If a take still reads male, re-roll that scene's seed off the global 42
# (josy-house-party used 1807 for exactly this) before adding words.
name: butterfly-dream

model:
  root: /home/erika/Projects/ai-models
  diffusion_model: minimax-h3/minimax_h3_ref2va_pruned-Q8_0.gguf
  llm:             minimax-h3/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  vae:             minimax-h3/minimax_h3_video_vae_fp16.safetensors
  audio_vae:       minimax-h3/minimax_h3_audio_vae_fp32.safetensors

docker:
  image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan
  devices: [/dev/dri/card1, /dev/dri/renderD128, /dev/kfd]
  run_as_current_user: true

defaults:
  width: 544
  height: 960
  fps: 24
  # ~3.75s. sd-cli rounds this UP, and not by one or two: measured on this box at
  # 544x960, 90 stays 90, 100 becomes 107, and 110 becomes 124. Check the
  # "generate_video 544x960xN" line in the log for what you actually got. 107 is
  # the largest count proven to render here - 124 DeviceLost'd three times out of
  # three on this hardware - so treat 100 as the ceiling for this script.
  video_frames: 90
  cfg_scale: 1.0
  seed: 42
  negative_prompt: ""       # no effect at cfg_scale 1.0 - CFG is off, so the
                            # negative prompt is never evaluated. Steer with
                            # positive description instead.
  # MUST stay empty for H3-structured prompts. full_prompt() appends the suffix
  # as ". <suffix>" at the very end - which here is the end of
  # non_diegetic_music, so the style text would read as part of the score. The
  # look lives in each scene's detailed_description opening line instead.
  style_suffix: ""
  extra_args: ["--diffusion-fa", "--mmap", "--backend", "te=cpu"]

continuity:
  # One still, passed to every scene: the dog sitting on the grey mat indoors by
  # the patio door. It is the only image that is right for all five scenes, and
  # in scene 5 it doubles as the room reference.
  anchors:
    - josy-reference.jpg

  # Reference *videos* stay empty on purpose: on this box a --ref-video either
  # crashes the GPU with DeviceLost or drags the whole pipeline onto the CPU.
  # Reference images do not - chaining has always used them.
  anchor_videos: []

  chain_from_previous: true

output:
  container: mp4
  audio: keep
  music: null

scenes:
  # -------------------------------------------------------------------------
  # 1. The garden.
  # -------------------------------------------------------------------------
  # chain_from_previous: false, so this scene sees the anchor plus its own ref.
  # <Picture 2> is essentially this shot already - the high-angle deck, the girl
  # crouched over the window box, the dog asleep at the lower left - so it is a
  # genuine composition anchor and not only a setting carrier.
  #
  # Two beats (the girl fills the box, the dog lifts her head and settles) is
  # why this one gets 100 frames.
  - id: planting
    chain_from_previous: false
    video_frames: 100         # ~4.46s actual - two beats need the room
    ref_images: [josy-balcony.jpg]
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1> and <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black in sunlight, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, a short wrinkled muzzle, and a flat black nose.
      <Subject 2> is the young girl in <Picture 2>, slight and long-limbed, with medium-length light brown wavy hair worn loose, a white sleeveless top, and pale grey jogging trousers; she is always seen from above and behind with her head bowed and her hair hanging forward, and her face is never visible.
      <Subject 3> is the sunlit roof terrace in <Picture 2>, a deck of weathered grey timber boards enclosed by a low red brick parapet wall with pale stone coping, with two weathered teak slatted armchairs set against the wall, a long terracotta window box, terracotta pots of small pink and purple flowers, a spiky blue-green ornamental fescue grass, and the roofs of neighbouring houses beyond the parapet.

      summary:
      [reference generation] The target video establishes <Subject 3> from a high angle. <Subject 2> crouches over the terracotta window box, scooping dark compost into it with a small blue trowel and pressing it flat with both hands, while <Subject 1> lies stretched out in a patch of sun on the deck boards nearby, lifts her head at the noise, and settles back down. <Picture 1> supplies <Subject 1>'s appearance; <Picture 2> supplies <Subject 2>, the terrace, and the high viewpoint.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, round dark eyes, short wrinkled muzzle, and flat black nose are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the loose light brown wavy hair, white sleeveless top, and pale grey jogging trousers are retained, and her hair hangs forward over her bowed head so that her face stays hidden exactly as in the reference.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the weathered grey deck boards, red brick parapet with pale stone coping, teak slatted armchairs, terracotta window box, potted pink and purple flowers, blue-green fescue grass, and neighbouring roofs are retained.

      detailed_description:
      The target video is photorealistic live-action cinematic footage in bright natural daylight on a warm summer afternoon, with hard sunlight and soft open shade, shallow depth of field, and fine film grain.
      [Shot 1] A high-angle wide shot looks steeply down onto the grey timber boards of <Subject 3>, taking in the brick parapet and the teak armchairs across the top of the frame. In the upper half <Subject 2> crouches low on her heels with her back three-quarters to the camera, bowed over the long terracotta window box, her loose light brown wavy hair hanging straight forward and completely covering her face so that only the crown of her head and her shoulders read. She pushes a small blue plastic trowel into a torn bag of dark potting compost, lifts a heaped scoop, tips it into the window box in a soft falling stream, sets the trowel down on the boards, then presses the loose soil flat with both hands and brushes her palms against each other. In the lower left of the frame <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, and large upright bat ears, lies stretched out on her side in a bar of direct sun, her spine toward the camera and her hind legs drawn up and stacked. Her ears twitch at the scrape of the trowel. She lifts her head, blinks slowly toward the girl, breathes out through her flat muzzle, and lowers her chin back onto the warm boards. The camera holds a static high-angle shot throughout and never drops to deck level.

      overall_soundscape: Open-air daytime ambience throughout - sparrows calling from nearby roofs, a light breeze moving through the ornamental grass, and faint street traffic far below. A metal trowel grinds through gritty compost, loose soil patters into a plastic window box, bare hands pat and brush together, and one deep snuffling sigh comes from a flat muzzle.

      non_diegetic_music: An unhurried fingerpicked acoustic guitar figure at a slow tempo with soft glockenspiel accents, warm and everyday, holding an even dynamic throughout.

  # -------------------------------------------------------------------------
  # 2. The drawing.
  # -------------------------------------------------------------------------
  # New angle on the same deck. The chained frame is the scene-1 composition, so
  # it is honestly only partially_preserved here - same terrace and light, new
  # viewpoint and new staging.
  #
  # This scene has to plant the chalk butterfly that scenes 3 and 4 both pay off,
  # so the drawing gets described by its colours and construction (pink outlines,
  # blue and green dots, a segmented blue body) - the same palette as
  # josy-butterfly.jpg, which is the reference scene 3 then uses. Get these
  # colours wrong and the match across the cut falls apart.
  - id: chalk-butterfly
    ref_images: [josy-balcony.jpg]
    prompt: |-
      subject_definitions:
      <Subject 1> is the young girl in <Picture 1> and <Picture 3>, slight and long-limbed, with medium-length light brown wavy hair worn loose, a white sleeveless top, and pale grey jogging trousers; she is always seen from above and behind with her head bowed and her hair hanging forward, and her face is never visible.
      <Subject 2> is the small female French bulldog in <Picture 1> and <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black in sunlight, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, and a short wrinkled muzzle.
      <Subject 3> is the sunlit roof terrace in <Picture 1> and <Picture 3>, a deck of weathered grey timber boards enclosed by a low red brick parapet wall, with weathered teak slatted furniture, terracotta pots of pink and purple flowers, and hard afternoon sunlight.

      summary:
      [reference generation] The target video cuts to a new viewpoint on <Subject 3>. <Subject 1> now kneels forward on the deck boards drawing a large butterfly in pavement chalk, sweeping out a pink wing outline and then stippling blue and green dots inside it, while <Subject 2> sits a short distance away watching the chalk move and tilting her head. <Picture 1> supplies the terrace, the light, and the two of them continuing from the previous shot; <Picture 2> supplies <Subject 2>'s appearance; <Picture 3> supplies the deck, the parapet, and the potted flowers.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the loose light brown wavy hair, white sleeveless top, and pale grey jogging trousers are retained, and her hair hangs forward over her bowed head so that her face stays hidden.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, round dark eyes, and short wrinkled muzzle are retained.
      <Subject 3> (appears in [Shot 1]): partially_preserved - the weathered grey deck boards, red brick parapet, teak slatted furniture, potted flowers, and hard afternoon sunlight are retained, seen from a new position on the far side of the deck with new staging.

      detailed_description:
      The target video is photorealistic live-action cinematic footage in bright natural daylight on a warm summer afternoon, with hard sunlight, shallow depth of field, and fine film grain.
      [Shot 1] A high-angle three-quarter shot looks down over the shoulder of <Subject 1> from a new position on the far side of <Subject 3>, with the red brick parapet and a terracotta pot of pink flowers across the top of the frame. <Subject 1> kneels forward on the grey deck boards, weight on one flat hand, her back and the crown of her head to the camera and her loose light brown wavy hair hanging straight down over her face so that none of it is visible. In her other hand she holds a worn stub of pink chalk. One large rounded wing outline is already drawn on the boards below her in soft pink; she sweeps the chalk in one long continuous arc to close the second wing, the chalk skipping and catching over the grain of the timber and leaving a dusty broken line. She sets the pink stub down, picks up a stub of pale blue chalk, and stipples a row of round dots inside the near wing, then adds a short chain of blue segments down the middle for the body. A soft pink cloud of chalk dust lifts and drifts across the boards. To the right of the drawing <Subject 2>, the small compact female French bulldog with the narrow finely-boned head, slender neck, and large upright bat ears, sits squarely on the deck watching the chalk, and tilts her head over to one side and holds it. The camera pushes in at slow speed and small amplitude, staying high and looking down, and never drops to deck level.

      overall_soundscape: Open-air daytime ambience throughout - sparrows on nearby roofs, a light breeze in the ornamental grass, and faint street traffic far below. Chalk scrapes and skips in long dry strokes over ridged timber, taps in short repeated dabs for the dots, and a knee shifts on the boards with a soft scuff. Collar tags jingle once on the head tilt.

      non_diegetic_music: A light plucked ukulele and glockenspiel figure at a moderate tempo, curious and playful, adding a soft brushed-shaker pulse as the dots are stippled in.

  # -------------------------------------------------------------------------
  # 3. The dog takes her seat.
  # -------------------------------------------------------------------------
  # The girl's point of view: she is out of frame apart from one hand at the
  # bottom edge, which is both the POV cue and the strongest possible guarantee
  # that no face appears.
  #
  # <Picture 3> (josy-butterfly.jpg) IS the last frame of this shot - the dog
  # sitting squarely on the chalk butterfly's body, looking straight up into a
  # steep top-down camera. That makes this the one scene where an image is a
  # concrete frame anchor rather than a subject reference, so it gets a standalone
  # <Picture N> line and the shot is written to land on it.
  #
  # Note josy-butterfly.jpg is landscape and this render is portrait. The framing
  # is written to suit the crop: the butterfly's body runs vertically up the
  # frame and the wings run out past both edges.
  #
  # Three beats (walk in, turn, sit and look up) is why this one gets 100 frames.
  - id: on-the-butterfly
    video_frames: 100         # ~4.46s actual - three beats. Do not raise: 110 -> 124 frames = DeviceLost.
    ref_images: [josy-butterfly.jpg]
    prompt: |-
      subject_definitions:
      <Subject 1> is the chalk butterfly drawn on the deck boards in <Picture 1> and <Picture 3>, roughly a metre across, with large rounded wings outlined in dusty pink, rows of pale blue, pink, and mint green chalk dots inside the wings, and a segmented pale blue body and antennae running up the middle.
      <Subject 2> is the small female French bulldog in <Picture 1>, <Picture 2>, and <Picture 3>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black in sunlight, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, a short wrinkled muzzle, and a flat black nose.
      <Picture 3> is the last frame of [Shot 1], showing <Subject 2> sitting squarely on the body of <Subject 1> and looking straight up into a steep top-down camera.

      summary:
      [reference generation + keyframe completion] The target video switches to the girl's own point of view, looking straight down at the finished <Subject 1> on the sunlit deck with only her hand and a stub of chalk at the bottom edge of frame. <Subject 2> walks in from the top of the frame, steps onto the drawing, turns, and sits down squarely on its body, then lifts her head and looks straight up into the camera. <Picture 1> supplies the drawing and the deck continuing from the previous shot; <Picture 2> supplies <Subject 2>'s appearance; the shot ends on <Picture 3>.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the dusty pink wing outlines, blue, pink, and mint green dots, and segmented pale blue body are retained, now seen complete and from directly overhead.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, round dark eyes, short wrinkled muzzle, and flat black nose are retained.
      <Picture 3> ([Shot 1] last frame): fully_preserved - the top-down viewpoint, the dog centred on the butterfly's body with her front paws forward, and her upward gaze into the camera are matched at the end of the shot.

      detailed_description:
      The target video is photorealistic live-action cinematic footage in bright natural daylight, shot handheld from a standing child's eye line looking straight down, with hard sunlight, strong cast shadows, and fine film grain.
      [Shot 1] A steep top-down point-of-view shot looks directly down at the grey timber boards of the sunlit deck, filled almost edge to edge by <Subject 1>, the chalk butterfly, its segmented pale blue body running vertically up the centre of the frame and its dusty pink wings running out past both side edges. A child's hand rests at the very bottom edge of frame holding a worn stub of pale blue chalk, chalk dust on the fingers; nothing else of her is in shot. The camera has the small unsteady drift of being held by hand. <Subject 2>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, and large upright bat ears, walks into frame from the top edge, her shoulders rolling and her nails clicking on the boards, and stops with her front paws on the drawing. She smudges one pink outline slightly underfoot. She turns her body a quarter turn to square up with the camera, lowers her hindquarters, and sits down on the butterfly's blue body with her front paws set neatly together in front of her. She raises her head and looks straight up into the lens, ears at full upright, the tip of her tongue showing at the front of her muzzle. One ear rotates. She holds the look, sitting perfectly still at the centre of the drawing.

      overall_soundscape: Open-air daytime ambience throughout - sparrows on nearby roofs, a light breeze in the ornamental grass, and faint street traffic far below. Blunt nails click and scuff across ridged timber boards, a dry chalk line smears under a paw, and a short snuffling breath through a flat muzzle lands as she settles.

      non_diegetic_music: A light plucked ukulele and glockenspiel figure at a moderate tempo continues, thinning as she walks in and resolving onto one soft sustained bell tone as she sits and looks up.

  # -------------------------------------------------------------------------
  # 4. The dream.
  # -------------------------------------------------------------------------
  # The turn, and the one shot in this script that is not literal. The morph is
  # written as a chain of physical events - the chalk lifts off the boards, gains
  # thickness and colour, attaches, then beats - rather than as "she transforms",
  # which tends to render as a dissolve to something unrelated.
  #
  # <Subject 1> is honestly partially_preserved here, not fully: her head, face,
  # ears, and coat carry over onto a winged body, and her four-legged body plan
  # does not. Claiming fully_preserved would fight the whole shot.
  #
  # <Picture 3> is josy-balcony.jpg rather than the butterfly image, because this
  # is the wide shot and it needs the flower pots, the parapet, and the far
  # rooftops. The chalk wings' colours come from <Picture 1>, the chained frame,
  # which is the top-down drawing itself.
  #
  # The girl appears here only as the top of her head from far above - see the
  # header note.
  - id: taking-flight
    video_frames: 100         # ~4.46s actual - the morph plus the pull-back
    ref_images: [josy-balcony.jpg]
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1> and <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black in sunlight, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, and a short wrinkled muzzle.
      <Subject 2> is the chalk butterfly drawn on the deck boards in <Picture 1>, with large rounded wings outlined in dusty pink, rows of pale blue, pink, and mint green chalk dots, and a segmented pale blue body.
      <Subject 3> is the sunlit roof terrace in <Picture 1> and <Picture 3>, a deck of weathered grey timber boards enclosed by a low red brick parapet wall with pale stone coping, with weathered teak slatted armchairs, terracotta pots of small pink and purple flowers, a spiky blue-green ornamental fescue grass, and the roofs of neighbouring houses beyond the parapet.
      <Subject 4> is the young girl in <Picture 3>, with medium-length light brown wavy hair worn loose and a white sleeveless top, seen in this shot only as the crown of her head from far above; her face is never visible.

      summary:
      [reference generation] The target video begins on <Subject 1> sitting at the centre of <Subject 2> and turns into a dream: the chalk wings peel up off the deck boards, thicken into real wings on her back, and lift her into the air over <Subject 3>, where she hovers above the pots of pink and purple flowers as the camera cranes back and up. <Picture 1> supplies the drawing, her position, and the light continuing from the previous shot; <Picture 2> supplies her appearance; <Picture 3> supplies the wider terrace, the flowers, and the parapet.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): partially_preserved - her narrow finely-boned head, large upright bat ears, round dark eyes, short wrinkled muzzle, near-black brindle coat, and white chest blaze are all retained, while her four-legged body plan is replaced by a small winged one.
      <Subject 2> (appears in [Shot 1]): attribute_transfer - the dusty pink wing outlines, blue, pink, and mint green dot pattern, and pale blue body markings leave the deck boards and become the wings and markings carried by <Subject 1>.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the weathered grey deck boards, red brick parapet with pale stone coping, teak slatted armchairs, potted pink and purple flowers, blue-green fescue grass, and neighbouring roofs are retained.
      <Subject 4> (appears in [Shot 1]): partially_preserved - the loose light brown wavy hair and white sleeveless top are retained; she is seen only as the crown of her head from far above and her face never appears.

      detailed_description:
      The target video is photorealistic live-action cinematic footage in bright natural daylight, turning dreamlike, with hard sunlight, floating chalk dust and pollen catching the light, shallow depth of field, and fine film grain.
      [Shot 1] The shot begins from the top-down framing of <Picture 1>, looking straight down at <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, and large upright bat ears, sitting squarely at the centre of <Subject 2> on the grey deck boards. The dusty pink outlines of the chalk wings begin to lift away from the timber at their edges, curling upward like paper, gaining thickness, colour, and a fine translucent membrane as they rise, the blue, pink, and mint green dots brightening into real markings. The wings swing up and settle against her back, now large and glowing softly at the edges, and the boards beneath her are left bare and clean. They beat once, slowly, and a wash of pink chalk dust blows outward across the deck. She lifts straight up off the boards. The camera cranes backward and upward with large amplitude at a slow, floating speed, widening from the empty drawing to the whole of <Subject 3> - the brick parapet, the teak armchairs, the neighbouring roofs beyond - as she rises. She glides across the terrace and slows into a hover above the terracotta pots of pink and purple flowers, her wings beating in long unhurried strokes, tipping and drifting as the flower heads nod beneath her. Far below in the corner of the frame, the crown of <Subject 4>'s head tilts back to watch her.

      overall_soundscape: The open-air daytime ambience of sparrows, breeze, and faint distant traffic softens and grows airy and reverberant as the shot lifts. A dry papery rustle as the chalk peels off the boards, a deep slow whoomph of large wings beating, and a steady soft flutter under the hover, with the ornamental grass hissing in the downdraught.

      non_diegetic_music: The plucked ukulele figure gives way to a slow rising swell of bowed strings, harp glissandi, and celesta at a broad tempo, growing steadily in volume and warmth through the lift and holding wide and sustained under the hover.

  # -------------------------------------------------------------------------
  # 5. Awake.
  # -------------------------------------------------------------------------
  # chain_from_previous: false. This is a hard cut out of the dream, and the
  # chained frame would be a butterfly hovering in open sky - useless as an
  # identity carrier and actively likely to put wings back on her. Turning
  # chaining off is what makes <Picture 1> the anchor, and josy-reference.jpg is
  # shot in exactly this room, so one reference covers both her and the setting.
  #
  # The wink is the button of the whole film, so it is written as a deliberate
  # held action with its own beat count. "Winks" on its own renders as a blink.
  # It is also placed LAST, with nothing after it, so a rounded-up frame count
  # cannot clip it.
  #
  # Three beats (dreaming twitch, wake and look around, wink) is why this one
  # gets 100 frames.
  - id: waking
    chain_from_previous: false
    video_frames: 100         # ~4.46s actual - three beats. Do not raise: 110 -> 124 frames = DeviceLost.
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, a short wrinkled muzzle, and a flat black nose.
