      [Shot 1] A medium shot from slightly above frames <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, and large upright bat ears, lying curled asleep on the soft dark grey mat on the pale wood-plank floor of <Subject 2>, her chin resting on her front paws and her spine toward the camera. Her eyes are shut and the loose skin of her muzzle is slack. Her front paws twitch and paddle in short rapid movements and her whiskers flicker, her closed eyelids moving. The twitching stops. Both eyes open at once, wide and round and unfocused. She raises her head off her paws, ears rising to full upright, and looks slowly around the empty room, first toward the window and then back the other way, plainly unsure where she is. She pushes herself up onto her chest. Then she turns her head square to the camera and holds the look, absolutely still, for a long beat. Her left eye closes on its own in one slow deliberate wink and opens again, and the tip of her tongue pushes out at the front of her muzzle. The camera holds a static shot throughout, level with or above her shoulder, and never moves behind or below her.

