# in-the-woods - a ten-scene short: the dog follows a wild rabbit out of the
# holiday house, down a burrow, into a Wonderland tea party - and wakes up.
#
#   ./moviemakr.py render scripts/h3/in-the-woods.yaml --dry-run
#   ./moviemakr.py render scripts/h3/in-the-woods.yaml --only 1
#   ./moviemakr.py render scripts/h3/in-the-woods.yaml
#   ./moviemakr.py status scripts/h3/in-the-woods.yaml
#
# Prompts are written through the `h3-prompt-writing` skill in full-reference
# (Ref2VA) form - see .claude/skills/h3-prompt-writing/references/ref-en.txt.
# The same two adaptations as scripts/h3/josy-house-party.yaml apply, because
# moviemakr generates one shot per docker run rather than a whole movie:
#
#   1. Every scene is a single [Shot 1] with no cut timestamp. The cuts in this
#      story happen between docker runs, not inside them.
#   2. detailed_description runs ~140-180 words, not the guide's 350-500. That
#      range is for a full multi-shot video; the guide's own rule is to spread
#      detail by information load, and one ~4-second shot carries far less.
#
# ---------------------------------------------------------------------------
# THE <Picture N> CONTRACT - read before editing any prompt
# ---------------------------------------------------------------------------
# Refs reach sd-cli as: chained previous frame first (render() inserts it at
# index 0), then continuity.anchors in order, then the scene's own ref_images.
#
# Unlike scripts/h3/josy-house-party.yaml, only ONE image is a global anchor
# here - josy-reference.jpg, the one thing every scene needs. The rabbit, the
# two location stills, and the Tenniel engraving are attached per scene, so no
# scene is handed a reference it has no job for. (A defined-but-unused label is
# a dangling label, and the model will try to honour it - the surest way to get
# a rabbit into the shot where she is supposed to be alone.)
#
# That makes the labels differ per scene. The full table:
#
#   scene 1  (chain off):  <P1> josy  <P2> centerparcs01       <P3> bunny
#   scene 2:               <P1> prev  <P2> josy  <P3> centerparcs02-1280  <P4> bunny-1280
#   scenes 3, 4, 5:        <P1> prev  <P2> josy  <P3> bunny
#   scenes 6, 7:           <P1> prev  <P2> josy  <P3> bunny  <P4> alice
#   scene 8  (chain off):  <P1> josy  <P2> centerparcs01
#   scene 9:               <P1> prev  <P2> josy  <P3> centerparcs01-1280  <P4> bunny-1280
#   scene 10:              <P1> prev  <P2> josy
#
# The -1280 variants in scenes 2 and 9 are the same photographs, downscaled.
# They are separate files rather than in-place edits on purpose: fingerprint()
# hashes reference *content*, so shrinking centerparcs01.jpg in place would
# invalidate scenes 1 and 8 as well and re-render two good clips at hours apiece.
#
# ---------------------------------------------------------------------------
# REFERENCE PIXEL BUDGET - the cause of the first run's two failures
# ---------------------------------------------------------------------------
# moviemakr does not resize references. sd_args() passes each host path straight
# through as -r, so a reference is encoded at whatever resolution the file is,
# and three of these assets are 2880x2168 = 6.24 MP each:
#
#   bunny.jpg  centerparcs01.jpg  centerparcs02.jpg   6.24 MP
#   josy-reference.jpg                                1.32 MP
#   alice-in-wonderland.jpg                           0.17 MP
#   a chained frame (544x960)                         0.52 MP
#
# On the first full run, scenes 2 and 9 DeviceLost'd three attempts out of three
# while every other scene rendered. Ranked by total reference megapixels, they
# were #1 and #2 - the only two scenes carrying TWO 6.24 MP images at once:
#
#   scene 9  goodbye        14.33 MP  4 refs  100 frames  FAILED
#   scene 2  the-approach   14.33 MP  4 refs  100 frames  FAILED
#   scene 1  the-glimpse    13.81 MP  3 refs  100 frames  ok (barely)
#   scene 7  the-guests      8.25 MP  4 refs  100 frames  ok
#   scene 6  the-tea-party   8.25 MP  4 refs  100 frames  ok
#
# Nothing else separates them. Ref *count* is ruled out (6 and 7 also carry four
# refs at 100 frames and were fine) and frame count is ruled out (1, 3, 6 and 7
# all ran 100). Prompt length is ruled out too - the two longest prompts in the
# file are scenes 6 and 1, both of which rendered. The failure signature is a
# lost GPU context immediately after tensor load, which is an allocation
# problem, and reference pixels are what scenes 2 and 9 had more of.
#
# At 1280 on the long side those two scenes drop to ~4.2 MP, well under the
# 8.25 MP that scenes 6 and 7 proved at the same frame count.
#
# TWO THINGS TO REMEMBER WHEN EDITING:
#   - Adding a full-size 2880x2168 ref to a scene that already has one is what
#     reproduces this. Check the budget, not just the ref count.
#   - Scene 1 sits at 13.81 MP, only 0.5 MP under the two that died. It has a
#     rendered clip and is left alone deliberately, but it is fragile: if you
#     ever --force it, expect it to fail, and switch it to the -1280 refs first.
#
# If you add or remove a ref_image, or flip chain_from_previous, every label in
# that scene shifts. Re-check the whole prompt, not just the line you edited.
#
# <Subject N> numbering is per scene, in order of first appearance, as the guide
# specifies. The same dog is <Subject 1> in scene 1 and <Subject 2> in scene 6.
# That is correct; each scene is an independent generation.
#
# ---------------------------------------------------------------------------
# TWO SCENES DELIBERATELY BREAK THE CHAIN
# ---------------------------------------------------------------------------
# Scene 8 is the hard cut out of the dream, back to the couch. Chaining it would
# hand it the tea-party clearing as its strongest reference and ask it to render
# a living room anyway. It gets chain_from_previous: false and leans on
# centerparcs01 instead. Scene 1 is the opening and has nothing to chain from.
#
# Scenes 8 and 9 still contribute their last frames downstream normally - only
# what scene 8 *receives* is cut.
#
# ---------------------------------------------------------------------------
# KEEPING HER FEMALE - don't drop these when editing
# ---------------------------------------------------------------------------
# Carried over from scripts/h3/josy-house-party.yaml, where the first take of
# scene 1 rendered a male dog despite a dozen "she"s. Grammatical gender is weak
# conditioning for this model, and a negative prompt cannot fix it (cfg_scale is
# 1.0, so CFG is off and the negative prompt is never evaluated). Two things
# carry it instead, in every scene where her body is visible:
#
#   1. Build, not pronouns. "small, compact, petite, narrow finely-boned head,
#      slender neck, light delicate frame" - male frenchies have broader,
#      blockier skulls and thicker necks, and that dimorphism is something the
#      model has actually learned. This appears in BOTH subject_definitions and
#      at her first appearance in detailed_description.
#   2. The camera is kept off her rear. What read as male was anatomy exposed by
#      framing from behind and below. Most scenes state shoulder-height framing
#      and front or three-quarter views.
#
# Scene 5 is the exception the story requires - the draft asks for the camera
# to follow behind her into the burrow. It is written as a following shot held
# at shoulder height and framed on her back, shoulders and ears, explicitly
# above her hips and never dropping below her. Watch this one on the first take.
#
# ---------------------------------------------------------------------------
# WONDERLAND WITHOUT THE ENGRAVING
# ---------------------------------------------------------------------------
# alice-in-wonderland.jpg is a hand-coloured Tenniel engraving and the rest of
# the film is photoreal. In scenes 6 and 7 it is labelled weak_reference on
# purpose: it supplies staging only - the long white cloth, the mismatched
# gold-rimmed china, the high-backed chairs outdoors under trees, the rabbit
# sitting upright in a human-like pose - and the prompts restate the
# photoreal look so the drawing's line and flat colour do not come with it.
name: in-the-woods

model:
  root: /home/erika/Projects/ai-models
  diffusion_model: minimax-h3/minimax_h3_ref2va_pruned-Q8_0.gguf
  llm:             minimax-h3/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  vae:             minimax-h3/minimax_h3_video_vae_fp16.safetensors
  audio_vae:       minimax-h3/minimax_h3_audio_vae_fp32.safetensors

docker:
  image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan
  devices: [/dev/dri/card1, /dev/dri/renderD128, /dev/kfd]
  run_as_current_user: true

defaults:
  # Portrait, like every other script here - it is what this box has actually
  # rendered. The location stills are landscape and scenes 6, 7 and 9 are the
  # widest shots in the film, so swapping to 960x544 is defensible; the pixel
  # budget is identical, but it is untested here, so it is not the default.
  width: 544
  height: 960
  fps: 24
  # ~3.75s. sd-cli rounds this UP, and not by one or two: measured on this box at
  # 544x960, 90 stays 90, 100 becomes 107, and 110 becomes 124. Check the
  # "generate_video 544x960xN" line in the log for what you actually got. 107 is
  # the largest count proven to render here - 124 DeviceLost'd three times out of
  # three on josy-house-party - so treat 100 as the hard ceiling for this script.
  video_frames: 90
  cfg_scale: 1.0
  seed: 42
  negative_prompt: ""       # no effect at cfg_scale 1.0 - CFG is off, so the
                            # negative prompt is never evaluated. Steer with
                            # positive description instead.
  # MUST stay empty for H3-structured prompts. full_prompt() appends the suffix
  # as ". <suffix>" at the very end - which here is the end of
  # non_diegetic_music, so the style text would read as part of the score. The
  # look lives in each scene's detailed_description opening line instead.
  style_suffix: ""
  extra_args: ["--diffusion-fa", "--mmap", "--backend", "te=cpu"]

continuity:
  # One anchor only. She is in nine of the ten scenes and is the one thing that
  # must not drift; everything else is scene-local. See the label contract above
  # for why the rabbit is not an anchor.
  anchors:
    - josy-reference.jpg

  # Reference *videos* stay empty on purpose: on this box a --ref-video either
  # crashes the GPU with DeviceLost or drags the whole pipeline onto the CPU.
  # Reference images do not - chaining has always used them.
  anchor_videos: []

  chain_from_previous: true

output:
  container: mp4
  audio: keep
  music: null

scenes:
  # -------------------------------------------------------------------------
  # 1. Something moves outside.
  # -------------------------------------------------------------------------
  # The only scene besides 8 with chain_from_previous: false, so it sees the
  # anchor plus its own two refs. It carries three beats (asleep, notice, lock
  # on) and has to establish the whole room, which is why it gets 100 frames.
  #
  # The rabbit is a shape behind glass here, not a character yet - so
  # <Picture 3> is honestly labelled partially_preserved. Giving it a small real
  # job is better than passing it and not mentioning it.
  - id: the-glimpse
    chain_from_previous: false
    video_frames: 100         # ~4.17s - three beats and a whole room
    ref_images:
      - centerparcs01.jpg
      - bunny.jpg
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black, faint lighter brindle striping over her flanks, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, a short deeply wrinkled muzzle, and a flat black nose.
      <Subject 2> is the holiday-house living room in <Picture 2>, with a pale grey wood-look laminate floor, a dark teal-blue fabric couch carrying a long mustard-yellow bolster cushion, a low grey daybed opposite it, floor-length beige curtains at the left edge, and a wall of tall black-framed sliding glass doors looking out onto a wet reddish-brown terrace, a white garden table with folding chairs, a closed dark parasol, and dense green woodland under a flat overcast sky.
      <Subject 3> is the wild European rabbit in <Picture 3>, small and rounded, with dense grey-brown agouti fur, a paler sandy face, long upright ears, and a short pale underside.
      <Picture 2> is the composition anchor for this shot, fixing the viewpoint, the couch position, and the glass wall.

      summary:
      [reference generation + keyframe completion] The target video holds the exact viewpoint of <Picture 2>, looking across the living room of <Subject 2> and out through the sliding glass doors. <Subject 1> lies curled and apparently asleep on the teal couch. One door panel stands slightly open. <Subject 3> crosses the terrace outside; she wakes, lifts her head, and locks on. <Picture 1> supplies her appearance.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, round dark eyes, and short wrinkled muzzle are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the pale grey laminate floor, dark teal couch with its mustard-yellow bolster, grey daybed, beige curtains, black-framed glass doors, wet terrace, garden table, closed parasol, and green woodland beyond are retained.
      <Subject 3> (appears in [Shot 1]): partially_preserved - the grey-brown agouti fur, pale face, and long upright ears are retained, seen small, distant, and softened through glass rather than in close detail.
      <Picture 2> ([Shot 1] composition anchor): fully_preserved - the viewpoint, couch placement, and glass wall are held for the whole shot; the dog and the opened door panel are new.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, cool and quiet, lit by flat grey daylight through a wall of glass, with shallow depth of field and fine film grain.
      [Shot 1] The camera holds the framing of <Picture 2> exactly and stays locked off: the pale grey laminate floor of <Subject 2> running to a wall of tall black-framed sliding glass doors, the dark teal couch with its mustard-yellow bolster cushion filling the lower left, the woodland terrace beyond. The house is empty and silent. One glass panel stands open a hand's width, and the beige curtain beside it stirs. <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, and large upright bat ears, lies curled along the couch in profile, head down on her paws, eyes shut, flanks rising slowly. Outside, past the wet reddish-brown paving and the white garden table, <Subject 3>, the grey-brown wild rabbit, hops into the far grass and stops. Her ears snap upright. Her eyes open. She lifts her head off her paws, holds absolutely still with her muzzle angled toward the glass, then pushes up onto her front legs, chest and white blaze turned toward the camera, staring out.

      overall_soundscape: Quiet empty-house room tone throughout, with a faint draught whistling through the gap in the open door. Light rain drips off the eaves outside, wind moves through the trees, a wood pigeon calls twice at a distance, and a curtain rustles. Fabric shifts on the couch and one short sharp sniff comes through a flat muzzle.

      non_diegetic_music: A single sustained low string note, very quiet under the room tone, joined by one soft struck piano note the moment her head lifts, holding unresolved to the end of the shot.

  # -------------------------------------------------------------------------
  # 2. Outside, and the meeting.
  # -------------------------------------------------------------------------
  # The one scene that crosses the threshold, so it needs both locations: the
  # chained frame carries the interior it starts in and centerparcs02 supplies
  # the terrace it ends on. Two beats plus the head tilt - 100 frames.
  #
  # The tilt is the payoff and it is placed last on purpose. If it gets clipped,
  # shorten the approach rather than raising video_frames past 100.
  - id: the-approach
    video_frames: 90         # ~4.17s - the exit, the approach, and the tilt
    # Downscaled refs - see the REFERENCE PIXEL BUDGET note in the header. At the
    # full-size 2880x2168 files this scene DeviceLost'd three attempts out of
    # three; it and scene 9 were the only two scenes carrying two 6.24 MP images
    # at once. Same photographs, 1280 on the long side.
    ref_images:
      - centerparcs02-1280.jpg
      - bunny-1280.jpg
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1> and <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, and a short deeply wrinkled muzzle.
      <Subject 2> is the terrace of the holiday house in <Picture 3>, with reddish-brown pebbled concrete paving still wet from rain, a wooden-topped garden table on a white metal frame, white sling folding chairs, a tall closed black parasol, a grey stone chimenea, two white sun loungers at the left, dry yellowed grass beyond the paving, and a dense green hedge and tall pines under an overcast sky.
      <Subject 3> is the wild European rabbit in <Picture 4>, small and rounded, with dense grey-brown agouti fur, a paler sandy face and cheeks, long upright ears with dark rims, one large round black eye, a pale underside, and a short white-grey tail.

      summary:
      [reference generation] The target video follows <Subject 1> out through the open glass door and across the terrace of <Subject 2> to meet <Subject 3>, which sits up on the dry grass and watches her come without bolting. She slows to a careful walk, stops a body-length away, and tilts her head far over to one side. <Picture 1> supplies the interior she leaves; <Picture 2> supplies her appearance.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, round dark eyes, and short wrinkled muzzle are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the wet reddish-brown pebbled paving, wooden garden table, white folding chairs, closed black parasol, stone chimenea, dry grass, and green hedge and pines are retained, seen from a much lower viewpoint.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the grey-brown agouti fur, pale sandy face, long upright ears, and round black eye are retained.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, cool and quiet, lit by flat grey overcast daylight, with shallow depth of field and fine film grain.
      [Shot 1] The camera begins inside at knee height behind <Subject 1>'s shoulder, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, and large upright bat ears, as she noses the open glass panel wider and steps out. It tracks with her at walking pace, swinging around to her side so she is held in profile and three-quarter front view at shoulder height, and stays there for the rest of the shot. Her claws tick across the wet reddish-brown paving of <Subject 2>, past the white folding chairs and the tall closed parasol. Ahead, on the dry yellowed grass, <Subject 3>, the grey-brown wild rabbit, sits up on its haunches, ears straight up, nose working. She slows, then stalks forward one deliberate paw at a time, head low and level. A body-length short of the rabbit she stops. Her ears rise to full upright. She tips her whole head far over to her right and holds it there.

      overall_soundscape: Outdoor woodland ambience throughout - wind through pines, water dripping from wet foliage, and layered birdsong with one wood pigeon close by. A glass door rolls in its track, claws tick and scuff on wet pebbled concrete, dry grass rustles, and a flat muzzle snuffles rapidly.

      non_diegetic_music: A sparse plucked-harp figure over a warm sustained pad, slow and curious, thinning to one held note as she stops, with a single soft woodwind trill on the head tilt.

  # -------------------------------------------------------------------------
  # 3. Tag.
  # -------------------------------------------------------------------------
  # The busiest scene in the film - two animals moving fast in opposite
  # directions - so it gets 100 frames and no location ref. The chained frame
  # already holds the grass and the treeline; adding centerparcs02 here would
  # only pull the shot back toward the paving and the furniture.
  - id: the-chase
    video_frames: 100         # ~4.17s - a full exchange of chases
    ref_images:
      - bunny.jpg
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1> and <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black, a white blaze covering the centre of her chest, large upright bat ears, and a short deeply wrinkled muzzle.
      <Subject 2> is the wild European rabbit in <Picture 1> and <Picture 3>, small and rounded, with dense grey-brown agouti fur, a paler sandy face, long upright ears, a round black eye, and a short white-grey tail.
      <Subject 3> is the lawn behind the holiday house in <Picture 1>, dry yellowed grass scattered with fallen leaves, backed by a dense green hedge and tall pines under an overcast sky.

      summary:
      [reference generation] The target video shows <Subject 1> and <Subject 2> playing tag across <Subject 3>. She drops into a play bow, the rabbit bolts, she gives chase in a wide circle, then the rabbit doubles back and runs at her and she scrambles away in turn. Both are plainly enjoying it. <Picture 2> supplies her appearance and <Picture 3> the rabbit's.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, and short wrinkled muzzle are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the grey-brown agouti fur, pale sandy face, long upright ears, and short white-grey tail are retained.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the dry yellowed grass, fallen leaves, green hedge, and tall pines are retained, seen wider than before.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, cool and bright, lit by flat grey overcast daylight, with shallow depth of field and fine film grain.
      [Shot 1] A low wide shot looks across the dry yellowed grass of <Subject 3>, the green hedge and pines filling the background. <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, and white chest blaze, drops into a play bow in the centre of frame, chest flat to the ground, rear end high, stub tail whipping, mouth open and tongue out. <Subject 2>, the grey-brown rabbit, thumps a hind foot and bolts left. She launches after it, ears flattened by her own speed, feet throwing up loose grass and leaves. The camera pans left with them at moderate speed, holding both in profile. The rabbit cuts a tight turn, doubles straight back past her shoulder, and she over-runs, skidding and wheeling around. Now the rabbit bounds at her and she scrambles backwards, bouncing stiff-legged on all four paws, then springs into another bow. The camera stays level with her shoulder, never dropping below or swinging behind her.

      overall_soundscape: Open woodland ambience throughout - wind in pines and steady birdsong. Fast paws thud on soft turf, dry grass and leaves tear and scatter, a hind foot thumps the ground twice, and a small dog pants hard with two short delighted play-barks and a bouncing collar tag.

      non_diegetic_music: A bright plucked-strings and hand-percussion pattern at a quick tempo, skipping and playful, gaining a shaker layer on the second chase and holding an even bouncing dynamic throughout.

  # -------------------------------------------------------------------------
  # 4. The invitation, and the hesitation.
  # -------------------------------------------------------------------------
  # The hinge of the film: the moment she chooses to leave the safe lawn. The
  # beat that has to land is the backward glance at the house, so the shot is
  # written with the treeline and the house on opposite sides of frame.
  - id: the-treeline
    ref_images:
      - bunny.jpg
    prompt: |-
      subject_definitions:
      <Subject 1> is the wild European rabbit in <Picture 1> and <Picture 3>, small and rounded, with dense grey-brown agouti fur, a paler sandy face, long upright ears, a round black eye, and a short white-grey tail.
      <Subject 2> is the small female French bulldog in <Picture 1> and <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, and a short deeply wrinkled muzzle.
      <Subject 3> is the edge of the woodland in <Picture 1>, where the dry yellowed lawn ends against a dense green hedge, bramble, and the trunks of tall pines, with the ground beyond falling into shadow under an overcast sky.

      summary:
      [reference generation] The target video shows <Subject 1> breaking off the game and hopping toward the shadowed treeline of <Subject 3>, pausing at the gap to look back. <Subject 2> stops short on the open grass, glances back over her shoulder toward the house behind her, hesitates, then trots after the rabbit into the shade. <Picture 2> supplies her appearance and <Picture 3> the rabbit's.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the grey-brown agouti fur, pale sandy face, long upright ears, and short white-grey tail are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, round dark eyes, and short wrinkled muzzle are retained.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the dry yellowed grass, dense green hedge, bramble, and pine trunks are retained, with the shadowed ground beyond now visible.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, cool and quiet, lit by flat grey overcast daylight that falls off sharply into the trees, with shallow depth of field and fine film grain.
      [Shot 1] A low medium-wide shot places the shadowed treeline of <Subject 3> at frame right and the open lawn running back to the pale holiday house, soft and out of focus, at frame left. <Subject 1>, the grey-brown wild rabbit, breaks off mid-game and hops steadily toward a dark gap between the bramble and the pine trunks. It stops in the gap, turns its head back over its shoulder, and waits with both ears straight up. <Subject 2>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, and large upright bat ears, comes after it at a trot, then plants all four paws and stops a few feet short of the shade. She is held in profile and three-quarter front view at shoulder height throughout. Her ears drop to half back. She turns her head to look behind her toward the house, holds it, then swings her muzzle front, ears rising again, and trots into the gap after the rabbit.

      overall_soundscape: Woodland ambience throughout, thinning as the shot moves toward the trees - wind in high branches, dripping foliage, and birdsong receding into an echoing hush. Paws move from soft turf onto damp leaf litter, dry bramble scrapes fur, one uncertain whine breaks off short, and breathing quickens.

      non_diegetic_music: The playful plucked-strings pattern from the chase falters and stops on her backward glance, replaced by a low sustained cello note and a single soft high bell as she steps into the shade, slow and hushed.

  # -------------------------------------------------------------------------
  # 5. Down the burrow.
  # -------------------------------------------------------------------------
  # The one shot that follows her from behind, because the draft asks for it.
  # The framing is pinned deliberately: shoulder height, on her back, shoulders
  # and ears, above her hips, never dropping lower. See the header note on why.
  #
  # This is also the darkest shot in the film. The bright opening ahead is what
  # keeps it readable and sets up scene 6 holding the same viewpoint.
  - id: the-burrow
    ref_images:
      - bunny.jpg
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1> and <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black, a white blaze on her chest, large upright bat ears, and a short deeply wrinkled muzzle.
      <Subject 2> is the wild European rabbit in <Picture 1> and <Picture 3>, small and rounded, with dense grey-brown agouti fur, long upright ears, and a short white-grey tail.
      <Subject 3> is the woodland of <Picture 1>, damp leaf litter, exposed roots, bramble, and pine trunks under a closed canopy.

      summary:
      [reference generation] The target video follows close behind <Subject 1> as she pushes after <Subject 2> into a low tunnel of arched roots and bramble in <Subject 3>. The tunnel is dark and tight, but a bright opening is visible at the far end and grows as they go, until the path ahead reads as clearly opening out. <Picture 2> supplies her appearance and <Picture 3> the rabbit's.

      retention_analysis:
