# debugging - a five-scene short: the dog waits for her human to leave, then
# debugs something on the laptop until she is nearly caught.
#
#   ./moviemakr.py render scripts/h3/debugging.yaml --dry-run
#   ./moviemakr.py render scripts/h3/debugging.yaml --only 1
#   ./moviemakr.py render scripts/h3/debugging.yaml
#   ./moviemakr.py status scripts/h3/debugging.yaml
#
# Prompts are written through the `h3-prompt-writing` skill in full-reference
# (Ref2VA) form - see .claude/skills/h3-prompt-writing/references/ref-en.txt.
# The same two adaptations as scripts/h3/josy-house-party.yaml apply, because
# moviemakr generates one shot per docker run rather than a whole movie:
#
#   1. Every scene is a single [Shot 1] with no cut timestamp. The cuts in this
#      story happen between docker runs, not inside them.
#   2. detailed_description runs ~130-190 words, not the guide's 350-500. That
#      range is for a full multi-shot video; the guide's own rule is to spread
#      detail by information load, and one ~4-second shot carries far less.
#
# ---------------------------------------------------------------------------
# THE <Picture N> CONTRACT - read before editing any prompt
# ---------------------------------------------------------------------------
# Refs reach sd-cli as: chained previous frame first (render() inserts it at
# index 0), then continuity.anchors in order, then any scene ref_images. With
# one anchor and chaining on, that fixes the labels for the whole file:
#
#   scene 1 (chain_from_previous: false, 1 ref):
#     <Picture 1> = assets/josy-computer.jpg
#
#   scenes 2-5 (chained, 2 refs):
#     <Picture 1> = the previous scene's last frame
#     <Picture 2> = assets/josy-computer.jpg
#
# If you turn chaining off on a scene, every label in it shifts down by one.
#
# josy-computer.jpg is doing an unusual amount of work here: it is the only
# anchor, and it happens to *be* scene 1's composition already - the dog sitting
# up behind the open sticker-covered laptop on the grey couch. So it carries her
# identity, the laptop, and the room all at once, which is why this script needs
# only one anchor where josy-house-party needed two.
#
# <Subject N> numbering is per scene, in order of first appearance, as the guide
# specifies. The same dog is <Subject 1> in scene 1 and <Subject 2> in scene 3;
# that is correct, since each scene is an independent generation.
#
# ---------------------------------------------------------------------------
# KEEPING HER FEMALE - don't drop these when editing
# ---------------------------------------------------------------------------
# Carried over from josy-house-party, where the first take of scene 1 rendered a
# male dog despite a dozen instances of "she". Grammatical gender is weak
# conditioning for this model, and a negative prompt cannot fix it (cfg_scale is
# 1.0, so CFG is off and the negative prompt is never evaluated). Two things
# carry it instead:
#
#   1. Build, not pronouns. "small, compact, petite, narrow finely-boned head,
#      slender neck, light delicate frame" - male frenchies have broader,
#      blockier skulls and thicker necks, and the model has learned that
#      dimorphism. This appears in BOTH subject_definitions and at her first
#      appearance in detailed_description.
#   2. The camera stays off her rear. Every scene pins the framing at or above
#      couch height and states that it never drops below her or swings behind
#      her body.
#
# This script is structurally safer than the party one on both counts: she is
# behind the laptop in every scene, so only her head, chest, and shoulders are
# ever in frame. If a take still reads male, re-roll that scene's seed off the
# global 42 (josy-house-party used 1807 for exactly this) before adding words.
#
# Scene 3 is the one reverse angle, and it is deliberately framed as a tight
# over-the-head shot held ABOVE her head height - the back of her skull and her
# two ears in silhouette against the screen, and nothing else of her. That is
# what keeps a shot "from behind" from becoming the shot that caused the
# problem in the first place.
name: debugging

model:
  root: /home/erika/Projects/ai-models
  diffusion_model: minimax-h3/minimax_h3_ref2va_pruned-Q8_0.gguf
  llm:             minimax-h3/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  vae:             minimax-h3/minimax_h3_video_vae_fp16.safetensors
  audio_vae:       minimax-h3/minimax_h3_audio_vae_fp32.safetensors

docker:
  image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan
  devices: [/dev/dri/card1, /dev/dri/renderD128, /dev/kfd]
  run_as_current_user: true

defaults:
  width: 544
  height: 960
  fps: 24
  # ~3.75s. sd-cli rounds this UP, and not by one or two: measured on this box at
  # 544x960, 90 stays 90, 100 becomes 107, and 110 becomes 124. Check the
  # "generate_video 544x960xN" line in the log for what you actually got. 107 is
  # the largest count proven to render here - 124 DeviceLost'd three times out of
  # three on this hardware - so treat 100 as the ceiling for this script.
  video_frames: 90
  cfg_scale: 1.0
  seed: 42
  negative_prompt: ""       # no effect at cfg_scale 1.0 - CFG is off, so the
                            # negative prompt is never evaluated. Steer with
                            # positive description instead.
  # MUST stay empty for H3-structured prompts. full_prompt() appends the suffix
  # as ". <suffix>" at the very end - which here is the end of
  # non_diegetic_music, so the style text would read as part of the score. The
  # look lives in each scene's detailed_description opening line instead.
  style_suffix: ""
  extra_args: ["--diffusion-fa", "--mmap", "--backend", "te=cpu"]

continuity:
  # One still, passed to every scene: the dog sitting up behind the open
  # sticker-covered laptop on the grey couch. It anchors her identity, the
  # laptop, and the room simultaneously, and scene 1 is essentially this frame
  # brought to life.
  anchors:
    - josy-computer.jpg

  # Reference *videos* stay empty on purpose: on this box a --ref-video either
  # crashes the GPU with DeviceLost or drags the whole pipeline onto the CPU.
  # Reference images do not - chaining has always used them.
  anchor_videos: []

  chain_from_previous: true

output:
  container: mp4
  audio: keep
  music: null

scenes:
  # -------------------------------------------------------------------------
  # 1. The human leaves.
  # -------------------------------------------------------------------------
  # The only scene with chain_from_previous: false, so it sees the single anchor
  # and nothing else. Three beats (wait, react to the door, start typing) is the
  # most of any scene here, which is why it gets 100 frames.
  #
  # The innocent stare is the whole joke, so it is described as a held
  # expression with a beat count rather than left to the model to invent.
  - id: waiting
    chain_from_previous: false
    video_frames: 100         # ~4.17s - three beats need the room
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, a short wrinkled muzzle, and a flat black nose.
      <Subject 2> is the open black laptop in <Picture 1>, its outer lid completely covered in bright colourful vinyl stickers, its dark keyboard deck angled toward the camera, and its screen glowing pale blue-white.
      <Subject 3> is the domestic living room in <Picture 1>, with a dark grey fabric couch, a grey patterned cushion, a soft white fleece blanket, and a white-painted radiator cover against a pale wall behind.

      summary:
      [reference generation] The target video opens on <Subject 1> sitting upright on the couch of <Subject 3> behind the open <Subject 2>, wearing a deliberately innocent expression while she waits. A front door closes off-screen; she snaps to attention, drops her gaze to the screen, and starts hammering at the keyboard with both front paws. <Picture 1> supplies her appearance, the laptop, and the room.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, round dark eyes, and short wrinkled muzzle are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the sticker-covered black lid, dark keyboard deck, and glowing screen are retained.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the dark grey fabric couch, grey patterned cushion, white fleece blanket, and pale wall behind are retained.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, warm and domestic, lit by soft indoor lamplight in the evening, with shallow depth of field and fine film grain.
      [Shot 1] A medium shot at couch height frames <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, and large upright bat ears, sitting upright on the dark grey couch of <Subject 3>, directly behind <Subject 2>, the open sticker-covered black laptop, so that only her head, chest, and shoulders rise above the top edge of the screen. She stares off past the camera toward her left, ears held half back, mouth closed, holding a flat, deliberately innocent expression, and blinks slowly twice. A door latch clicks and a heavy front door thuds shut somewhere off-screen behind the camera. Her ears snap fully upright and her head turns sharply front. Her eyes drop to the glowing screen. She shuffles forward on the cushion, lifts both small dark front paws onto the keyboard, and begins tapping at it fast and messily, shoulders working, the pale screen light flickering across her wrinkled muzzle. The camera holds a static three-quarter front view level with her shoulder throughout, never moving behind her or below her.

      overall_soundscape: Quiet evening indoor room tone throughout. A door latch clicks, a heavy front door thuds shut off-screen, and muffled footsteps recede outside. Fabric shifts on the couch cushion, and a rapid uneven clatter of blunt claws on plastic keys begins in the last third.

      non_diegetic_music: A sneaky pizzicato-strings figure with a light woodblock tap at a moderate tempo, quiet and conspiratorial, adding a second faster string layer the moment the typing starts.

  # -------------------------------------------------------------------------
  # 2. She runs it.
  # -------------------------------------------------------------------------
  # The chained frame from scene 1 ends mid-typing on the exact framing this
  # scene continues, so <Picture 1> is a genuine composition anchor here rather
  # than just an identity carrier, and the description says so.
  #
  # The ENTER press needs to be one heavier, isolated sound against the rattle
  # of the rest, or the beat does not read. It is written as a separate action
  # with its own key size and its own sound rather than folded into the typing.
  - id: enter
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1> and <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, and a short wrinkled muzzle.
      <Subject 2> is the open black laptop in <Picture 1> and <Picture 2>, its lid covered in bright colourful vinyl stickers, with a dark keyboard deck and a glowing pale blue-white screen.
      <Subject 3> is the domestic living room in <Picture 1> and <Picture 2>, with a dark grey fabric couch, a grey patterned cushion, and soft evening lamplight.

      summary:
      [reference generation] The target video continues directly from the previous shot: <Subject 1> keeps typing on <Subject 2> with both front paws, then presses one large key deliberately with a single paw and sits back to wait, staring at the screen. <Picture 1> supplies the framing and the typing already in progress; <Picture 2> supplies her appearance and the laptop.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, round dark eyes, and short wrinkled muzzle are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the sticker-covered lid, dark keyboard deck, and glowing screen are retained.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the dark grey couch, grey patterned cushion, and evening lamplight are retained.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, warm and domestic, lit by soft evening lamplight, with shallow depth of field and fine film grain.
      [Shot 1] The shot begins from the framing of <Picture 1>, a medium shot at couch height on <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, and large upright bat ears, sitting upright behind the open <Subject 2> on the couch of <Subject 3>, only her head, chest, and shoulders above the screen. Both her small dark front paws are already working the keyboard, alternating in a fast clumsy rhythm, her head tipped down and her eyes locked on the screen. The camera pushes in at slow speed and small amplitude, staying level with her shoulder and holding her three-quarter front view. Her paws slow. She lifts her right front paw clear of the keys, holds it in the air for a moment, and brings it down hard and square on one large key at the edge of the keyboard. She lifts the paw away, straightens up, and settles back onto her haunches. Her ears rise to full upright. She stares at the screen without blinking, absolutely still, the reflected screen light shifting on her eyes.

      overall_soundscape: Quiet evening indoor room tone throughout. A rapid uneven clatter of blunt claws on plastic keys runs through the first half and slows to nothing, followed by one heavier, deeper, isolated key thunk. After it, near silence - only a faint laptop fan whine and a short snuffling breath through a flat muzzle.

      non_diegetic_music: A fast pizzicato-strings and woodblock pattern locked to the typing rhythm, cutting off dead on the single key press and leaving one quiet sustained string note held under the wait.

  # -------------------------------------------------------------------------
  # 3. The screen.
  # -------------------------------------------------------------------------
  # The reverse angle. Two things matter here:
  #
  #   1. Framing. The camera sits ABOVE her head height and the frame is tight -
  #      the back of her skull and her two ears in silhouette, and the screen.
  #      Her body is explicitly out of frame. See the header note.
  #   2. The terminal is described by its LOOK, not by its text. Legible words
  #      are not something this model can be trusted to draw, and a screen full
  #      of mangled pseudo-English reads worse than a screen full of convincing
  #      monospace texture. Colour, density, scroll speed, and one red block do
  #      all the work.
  #
  # <Picture 1> is honestly marked partially_preserved: the laptop, screen glow,
  # couch, and lighting continue, but the viewpoint flips 180 degrees and her
  # face is gone. Claiming fully_preserved here would be asking for the front
  # view back.
  - id: the-terminal
    prompt: |-
      subject_definitions:
      <Subject 1> is the open black laptop in <Picture 1> and <Picture 2>, with a dark keyboard deck and a bright screen, seen in this shot from behind so the screen faces the camera.
      <Subject 2> is the small female French bulldog in <Picture 1> and <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, a short dark brindle coat that reads almost black, and large upright bat ears with thin skin, seen in this shot only as the back of her head and ears.
      <Subject 3> is the domestic living room in <Picture 1> and <Picture 2>, with a dark grey fabric couch and soft evening lamplight.

      summary:
      [reference generation] The target video reverses the viewpoint to sit behind and above <Subject 2>, looking over the back of her head at the screen of <Subject 1>. The screen fills most of the frame with a dark full-screen terminal, pale monospace output scrolling rapidly, a dense block of text, and one bright red section. Her silhouetted ears twitch as it scrolls. <Picture 1> supplies the laptop, the screen glow, and the lighting; <Picture 2> supplies her coat and ear shape.

      retention_analysis:
      <Subject 1> ([Shot 1] composition anchor): partially_preserved - the open laptop, its bright screen, and the couch and lamplight around it are retained, now seen from the opposite side so the screen faces the camera and the sticker-covered lid is hidden.
      <Subject 2> (appears in [Shot 1]): partially_preserved - the near-black brindle coat and the large upright bat ears are retained in silhouette; her face, chest, and body are out of frame.
      <Subject 3> (appears in [Shot 1]): partially_preserved - the dark grey couch and evening lamplight are retained, seen from a reversed viewpoint and pushed far out of focus.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, warm and domestic, with the laptop screen as the dominant light source, very shallow depth of field, and fine film grain.
      [Shot 1] A tight over-the-head shot sits behind and slightly above <Subject 2>, framing only the back of her small round skull and her two large bat ears, held in near-silhouette across the bottom of the frame with the thin skin of the ears glowing faintly where the light passes through them. Her body is entirely out of frame and the camera never tilts down past her ears. Beyond her, filling the upper two thirds of the frame and sharply in focus, is the screen of <Subject 1>, showing a dark full-screen terminal window on a Linux desktop. Line after line of pale grey and green monospace text scrolls upward quickly, in ragged blocks of varying length, with a thin blinking cursor at the bottom left. The scroll stalls. A dense paragraph of tightly packed text prints, and a bright red block of several lines appears in the middle of it and stays on screen. The camera holds completely static. Her left ear rotates once, then both ears flatten slightly. Everything behind the laptop is a soft dark blur of the couch of <Subject 3>.

      overall_soundscape: Quiet evening indoor room tone throughout. A steady faint laptop fan whine sits under everything, with a soft electrical hiss from the screen, one short flat system beep as the red text appears, and a slow snuffling breath through a flat muzzle just off-microphone.

      non_diegetic_music: A low pulsing synth tick at a steady moderate tempo with a single hollow bell tone, quiet and curious, dropping to a bare held drone when the red block appears.

  # -------------------------------------------------------------------------
  # 4. The head tilt.
  # -------------------------------------------------------------------------
  # Back to the front view. The chained frame is the reverse angle, so it can
  # only be partially_preserved for the room and the laptop - <Picture 2> is
  # what brings her face back.
  #
  # The tilt is the shot. It gets an explicit angle, a hold, and a return,
  # because "tilts her head" on its own tends to render as a small twitch.
  - id: head-tilt
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, a short wrinkled muzzle, and a flat black nose.
      <Subject 2> is the open black laptop in <Picture 1> and <Picture 2>, its lid covered in bright colourful vinyl stickers, with a dark keyboard deck and a glowing screen.
      <Subject 3> is the domestic living room in <Picture 1> and <Picture 2>, with a dark grey fabric couch, a grey patterned cushion, and soft evening lamplight.

      summary:
      [reference generation] The target video returns to the front viewpoint on <Subject 1> sitting behind <Subject 2> in <Subject 3>. She reads the screen, tilts her head far over to one side and holds it there in confusion, straightens up, and taps out three slow deliberate keystrokes with one paw. <Picture 1> supplies the laptop, the screen glow, and the lighting continuing from the previous shot; <Picture 2> supplies her appearance and the sticker-covered lid.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, round dark eyes, short wrinkled muzzle, and flat black nose are retained.
      <Subject 2> (appears in [Shot 1]): partially_preserved - the open laptop, its glowing screen, and its position on the couch are retained; the viewpoint returns to the front, so the sticker-covered lid faces the camera again and the screen is no longer visible.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the dark grey couch, grey patterned cushion, and evening lamplight are retained.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, warm and domestic, lit by soft evening lamplight with pale screen light on her face, shallow depth of field, and fine film grain.
      [Shot 1] A medium shot at couch height frames <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, and large upright bat ears, sitting upright on the couch of <Subject 3> behind the open <Subject 2>, its sticker-covered lid toward the camera and only her head, chest, and shoulders above the screen. Screen light lies pale and even across her wrinkled muzzle. Her eyes move as she reads. The loose skin above her eyes creases. She tilts her whole head slowly over to her right, well past forty-five degrees, one ear dropping and the other staying upright, and holds the tilt there for a long beat, eyes still fixed on the screen. She straightens her head, blinks once, then tilts it a little the other way and back. She lifts her right front paw, extends one toe, and presses three keys in three slow separate deliberate taps, watching the screen between each one. Her eyes narrow. The camera holds a static three-quarter front view level with her shoulder, never moving behind or below her.

      overall_soundscape: Quiet evening indoor room tone throughout. A faint laptop fan whine runs underneath. Collar tags jingle softly on each head tilt, fabric creaks on the couch, and three isolated plastic key clicks land in the last third, well spaced, with a short puzzled snort between the second and the third.

      non_diegetic_music: A single inquisitive plucked-ukulele figure with one hollow woodblock knock on the head tilt, quiet and unhurried, thinning to one held note under the three keystrokes.

  # -------------------------------------------------------------------------
  # 5. Caught.
  # -------------------------------------------------------------------------
  # The button, and the mirror of scene 1 - the same door, from the other
  # direction. Three beats (startle, close the lid, leave) is why it gets 100
  # frames.
  #
  # The last beat is the empty frame: the closed laptop, the light gone, the
  # cushion still moving. That is the shot the film ends on, so it is written
  # explicitly rather than left as "she leaves". The camera does NOT follow her
  # out - it stays static, and she exits in profile toward camera-left, which is
  # also what keeps the framing rule of the other four scenes intact.
  #
  # No dialogue on purpose. If you want a button, an off-screen voice calling
  # her name would fit in the last half-second - assign it (S1) and wrap it as
  # <d>[English] Josy?</d> - but at 107 frames the three physical beats are
  # already tight, and a clipped line is worse than no line.
  - id: caught
    video_frames: 100         # ~4.46s actual - three beats. Do not raise: 110 -> 124 frames = DeviceLost.
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1> and <Picture 2>, compact and petite with a narrow finely-boned head, a slender neck, and a light delicate frame, with a short dark brindle coat that reads almost black, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, and a short wrinkled muzzle.
      <Subject 2> is the open black laptop in <Picture 1> and <Picture 2>, its lid covered in bright colourful vinyl stickers, with a dark keyboard deck and a glowing screen.
      <Subject 3> is the domestic living room in <Picture 1> and <Picture 2>, with a dark grey fabric couch, a grey patterned cushion, a soft white fleece blanket, and warm evening lamplight.

      summary:
      [reference generation] The target video shows <Subject 1> at <Subject 2> when a key turns in a front door off-screen. She freezes, shoves the laptop lid shut with her muzzle, scrambles off the couch of <Subject 3>, and leaves the frame, which ends on the closed laptop alone in the lamplight. <Picture 1> supplies the framing, her position, and the lighting continuing from the previous shot; <Picture 2> supplies her appearance and the sticker-covered lid.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the near-black brindle coat, white chest blaze, large upright bat ears, round dark eyes, and short wrinkled muzzle are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the sticker-covered lid, dark keyboard deck, and glowing screen are retained; the lid closes during the shot and the screen light goes out.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the dark grey couch, grey patterned cushion, white fleece blanket, and warm evening lamplight are retained.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, warm and domestic, lit by soft evening lamplight, with shallow depth of field and fine film grain.
      [Shot 1] A medium shot at couch height frames <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, and large upright bat ears, sitting upright on the couch of <Subject 3> behind the open <Subject 2>, one front paw resting on the keyboard. A key rattles into a lock and turns off-screen behind the camera. Her whole body goes rigid. Her head snaps up and her eyes stretch wide with the whites showing, ears flaring to full upright. She lunges forward, hooks her flat wrinkled muzzle over the top edge of the screen, and shoves the lid down hard; it swings shut and clacks against the keyboard deck, and the pale screen light vanishes so that only warm lamplight remains on her face. Without pausing she twists to her left, scrambles across the cushion in profile, and drops off the front of the couch out of the left edge of frame. The camera holds completely static and does not follow her. The final beat holds on the closed sticker-covered laptop sitting alone on the empty couch, the grey cushion still rocking and the white fleece blanket dragged into a fold.

      overall_soundscape: Quiet evening indoor room tone throughout. A key rattles into a lock, the bolt turns, and a heavy front door swings open off-screen with a draught of outside traffic behind it. A hard plastic clack as the laptop lid shuts, claws raking couch fabric, a soft thud of a small body landing on the floor, and receding claw-taps hurrying away. The room tone settles back into silence over the empty couch.

      non_diegetic_music: A sudden fast agitated pizzicato-strings scramble with a driving low drum pulse, entering on the key in the lock and cutting to complete silence the instant the laptop lid shuts.
