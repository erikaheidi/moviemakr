# cats-cooking, with every prompt rewritten through the `h3-prompt-writing`
# skill (.claude/skills/h3-prompt-writing/references/ref-en.txt).
#
# This is an A/B against scripts/cats-cooking.yaml. Everything that is not the
# prompt is held constant - same model, same seed 42, same dimensions, same
# frame counts, same empty anchor_videos - so any difference in the output is
# the prompt structure and nothing else. Renders land in renders/cats-cooking-h3/
# rather than clobbering renders/cats-cooking/.
#
#   ./moviemakr.py render scripts/h3/cats-cooking-h3.yaml --dry-run
#   ./moviemakr.py render scripts/h3/cats-cooking-h3.yaml
#
# Two adaptations of the guide were needed, because the guide assumes one
# generation produces the whole movie and moviemakr generates one shot per
# docker run:
#
#   1. Every scene is a single [Shot 1] with no cut timestamp. Multi-shot
#      descriptions with cut times would ask a 3.75s generation to fit a cut it
#      has no room for; the cuts here are between docker runs, not inside them.
#   2. detailed_description runs ~120-150 words, not the guide's 350-500. That
#      range is for a full multi-shot video; the guide's own rule is to
#      distribute detail by information load, and one 4-second shot carries far
#      less than a 15-second sequence.
name: cats-cooking-h3

model:
  root: /home/erika/Projects/ai-models
  diffusion_model: minimax-h3/minimax_h3_ref2va_pruned-Q8_0.gguf
  llm:             minimax-h3/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  vae:             minimax-h3/minimax_h3_video_vae_fp16.safetensors
  audio_vae:       minimax-h3/minimax_h3_audio_vae_fp32.safetensors

docker:
  image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan
  devices: [/dev/dri/card1, /dev/dri/renderD128, /dev/kfd]
  run_as_current_user: true

defaults:
  width: 544
  height: 960
  fps: 24
  video_frames: 90          # ~3.75s
  cfg_scale: 1.0
  seed: 42                  # unchanged from cats-cooking.yaml, so this is a fair A/B
  negative_prompt: ""
  # MUST be empty for H3-structured prompts. full_prompt() appends the suffix as
  # ". <suffix>" at the very end of the prompt - which here is the end of
  # non_diegetic_music, so the style text would read as part of the score. The
  # look now lives in each scene's detailed_description opening line instead.
  style_suffix: ""
  extra_args: ["--diffusion-fa", "--mmap", "--backend", "te=cpu"]

continuity:
  # Still empty: reference videos are what put this box on the CPU fallback path,
  # and this test is about prompt structure, not about re-testing that.
  anchor_videos: []
  chain_from_previous: true

output:
  container: mp4
  audio: keep
  music: null

scenes:
  # Scene 1 has chain_from_previous: false and there are no anchors, so it renders
  # with ZERO reference images. With no refs there is nothing for <Picture N> to
  # point at, so this scene uses the base T2VA three-field form from base-en.txt
  # rather than the six-section full-reference form. Inventing a <Picture 1> here
  # would be a dangling label.
  #
  # v2 of this prompt: the first take read "standing upright at a domestic stove"
  # and the model put the cat ON the stove. "at a stove" never pins where his feet
  # are. The fix is to state the floor contact, the profile angle, and the bipedal
  # posture as separate visible facts instead of implying them. Note that a
  # negative_prompt is not an option here - cfg_scale is 1.0, which disables
  # classifier-free guidance, so the negative prompt has no effect at all.
  - id: cooking
    chain_from_previous: false
    prompt: |-
      integrated_multimodal_description: [Shot 1] Live-action, cinematic, photorealistic with fine film grain, a full-body medium shot from a side angle frames an orange tabby cat in complete profile, facing frame right, standing on his hind legs on the tiled kitchen floor in front of a domestic stove. He holds a human-like bipedal posture with his hind paws flat on the floor, his back straight, his shoulders squared, and his chest level with the countertop, standing the way a person stands while cooking. He wears a tall white chef hat and a white apron tied at the waist. Warm tungsten light rakes in from frame left and shallow depth of field holds him sharp while the tiled backsplash behind him falls soft. A dark frying pan sits on the burner in front of him; he steadies its handle with one front paw and holds a wooden spoon in the other. The camera holds a static shot in profile as he tosses diced red peppers and green vegetables upward in the pan, catches them, and stirs twice with the spoon. Steam rises off the pan and drifts through the warm key light. His ears flick forward and his whiskers twitch as he tips his head down toward the pan.

      overall_soundscape: Vegetables sizzle steadily in hot oil while a wooden spoon scrapes and taps the side of the pan. A low extractor-fan hum continues underneath, with a soft rustle of apron fabric as the cat shifts his weight.

      non_diegetic_music: A light pizzicato-strings pattern at a moderate tempo over a soft brushed-snare pulse, holding an even dynamic throughout.

  # From here each scene receives exactly one reference image: the previous
  # scene's last frame, inserted at index 0 by render(). One ref means no
  # --increase-ref-index, so <Picture 1> is unambiguous.
  #
  # Note the task type is `reference generation`, not `keyframe completion`. The
  # chained frame is NOT this shot's first frame - the location changes between
  # every scene in this script. It carries the chef's identity and the look, which
  # is a subject reference. Calling it keyframe completion would tell the model to
  # open on a kitchen it is supposed to have already left.
  - id: serving
    prompt: |-
      subject_definitions:
      <Subject 1> is the orange tabby chef cat in <Picture 1>, with orange-and-cream striped fur, a tall white chef hat, and a white apron tied at the waist.

      summary:
      [reference generation] The target video follows <Subject 1> carrying a steaming plate of food across a dim restaurant interior to a lamplit table where two seated cats wait with napkins tucked at their collars. <Picture 1> supplies <Subject 1>'s appearance and the warm cinematic look; the restaurant setting is new.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the orange-and-cream striped fur, tall white chef hat, and white apron tied at the waist are retained.

      detailed_description:
      The target video is photorealistic live-action cinematic footage with warm practical lighting, shallow depth of field, and fine film grain.
      [Shot 1] A medium shot frames <Subject 1>, the orange tabby chef cat in the tall white hat and white apron, walking toward the camera through a dim restaurant interior while carrying a wide white plate of steaming red-sauced food level in both front paws. The camera tracks backward with small amplitude at slow speed, holding him centred as warm lamplight passes across his face and hat. He reaches a small round table covered with a white cloth where two seated cats wait, a grey tabby and a black-and-white tuxedo cat, each with a white napkin tucked at the collar. Both lean forward as the plate arrives. <Subject 1> lowers the plate onto the tablecloth and steam curls upward between the three of them.

      overall_soundscape: Low restaurant room tone with faint distant cutlery continues throughout. Padded footsteps cross a wooden floor, ceramic settles against the tablecloth, and napkin fabric rustles as the seated cats lean in.

      non_diegetic_music: A relaxed upright-bass and brushed-drum pattern at a moderate tempo, with a muted trumpet line entering softly partway through.

  - id: too-spicy
    video_frames: 100         # ~4.17s - physical comedy needs the extra beat
    prompt: |-
      subject_definitions:
      <Subject 1> is the grey tabby diner cat in <Picture 1>, seated at the table with a white napkin tucked at the collar.
      <Subject 2> is the black-and-white tuxedo diner cat in <Picture 1>, seated opposite <Subject 1> with a white napkin tucked at the collar.
      <Subject 3> is the lamplit restaurant table in <Picture 1>, with its white tablecloth and the wide white plate of red-sauced food.

      summary:
      [reference generation] The target video pushes in close on <Subject 1> and <Subject 2> at <Subject 3> as both take a bite of the fiery red dish and react in shock, eyes wide, faces flushing, steam bursting from their ears. <Picture 1> supplies both diners, the table, and the warm lamplit look.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the grey tabby markings and the white napkin tucked at the collar are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the black-and-white tuxedo markings and the white napkin tucked at the collar are retained.
      <Subject 3> (appears in [Shot 1]): partially_preserved - the white tablecloth, warm lamplight, and the wide white plate of red-sauced food are retained, seen from a closer viewpoint.

      detailed_description:
      The target video is photorealistic live-action cinematic footage with warm lamplight, shallow depth of field, and fine film grain.
      [Shot 1] A close two-shot frames <Subject 1> and <Subject 2> facing each other across <Subject 3>, each lifting a forkful of the glistening red-sauced food. The camera holds a static shot as both take the bite at the same moment and chew once. Their eyes snap wide open and their pupils shrink to points. Both freeze, turn their heads to look at each other, and their faces flush deep red beneath the fur from the muzzle outward. Thin white puffs of steam burst from both cats' ears in short bursts and rise into the lamplight. Both begin fanning their open mouths rapidly with their front paws, tongues out, whiskers quivering, while the plate of red food sits untouched between them.

      overall_soundscape: Low restaurant room tone continues underneath. Cutlery clicks against ceramic, followed by two sharp intakes of breath, short high-pitched squeaks, a soft hiss of escaping steam, and the rapid flutter of paws fanning through air.

      non_diegetic_music: An upright-bass and brushed-drum pattern at a moderate tempo cuts off abruptly on the bite, leaving a single sustained high string note that climbs in volume through the reaction.

  # The continuity trap this script has, which the skill's retention_analysis step
  # is what surfaced: the chained frame here is the END of too-spicy, which shows
  # the two DINERS. The chef is not in it. So this scene has no visual reference
  # for the chef at all - his appearance has to be rebuilt from text, three scenes
  # after it was last anchored. <Picture 1> can only be a weak_reference for the
  # room. Labelling it honestly at least stops the prompt from claiming a
  # consistency the refs cannot deliver. The real fix is a continuity.anchors
  # character sheet; see the note in the render report.
  - id: chef-reaction
    video_frames: 100
    prompt: |-
      subject_definitions:
      <Subject 1> is the lamplit restaurant interior in <Picture 1>, with its warm practical lighting, dark background, and white table linen.

      summary:
      [reference generation] The target video cuts to the orange tabby chef cat standing behind the restaurant counter, laughing out loud and holding up a bottle labelled "the world's hottest sauce". <Picture 1> supplies only the restaurant's lighting and colour treatment; the chef and the counter are generated from this description.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): weak_reference - only the warm lamplit interior, dark background, and white linen tone are carried over; the viewpoint, subjects, and staging are all new.

      detailed_description:
      The target video is photorealistic live-action cinematic footage matching <Subject 1>'s warm lamplight, shallow depth of field, and fine film grain.
      [Shot 1] A medium shot frames an orange tabby cat with orange-and-cream striped fur, a tall white chef hat, and a white apron tied at the waist, standing upright behind a restaurant counter in <Subject 1>. The camera pushes in with small amplitude at slow speed as he throws his head back and laughs out loud, mouth wide open, eyes squeezed shut, shoulders shaking. He raises one front paw and holds up a small dark glass bottle with a red label reading "the world's hottest sauce", turning it toward the camera so the label faces front. He steadies himself against the counter with his other paw, still laughing, and tips the bottle slightly as his ears fold back.

      overall_soundscape: Low restaurant room tone continues underneath. Loud open-mouthed laughter carries across the room, with glass tapping once against the wooden counter and fabric shifting as his shoulders shake.

      non_diegetic_music: A bright upright-bass and brushed-drum pattern at a brisk tempo enters on the first laugh, joined by a muted trumpet phrase, and holds an even dynamic to the end.
