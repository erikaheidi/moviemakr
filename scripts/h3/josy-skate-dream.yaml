# josy-skate-dream - an eight-scene short.
# Josy taps out a message on the phone beside her on the couch. Cut inside the
# screen: a group chat with Pipa the tabby and Preta the little black-and-tan
# terrier. The chat becomes a split-screen video call, the three of them agree
# on the beach, and the film cuts to a promenade with no humans on it at all -
# dogs playing volleyball, cats on inline skates. Josy rides through it on her
# skateboard, Pipa and Preta pull alongside, and the three of them go. Cut back
# indoors: Josy is asleep in her dog bed, wakes, looks around, smiles, and goes
# back to sleep. It was hers.
#
#   ./moviemakr.py render scripts/h3/josy-skate-dream.yaml --dry-run
#   ./moviemakr.py render scripts/h3/josy-skate-dream.yaml --only 1
#   ./moviemakr.py render scripts/h3/josy-skate-dream.yaml
#   ./moviemakr.py status scripts/h3/josy-skate-dream.yaml
#
# Prompts are written through the `h3-prompt-writing` skill in full-reference
# (Ref2VA) form - see .claude/skills/h3-prompt-writing/references/ref-en.txt.
# Same two adaptations as scripts/h3/josy-bat-dream.yaml, because moviemakr
# generates one shot per docker run rather than a whole movie:
#
#   1. Every scene is a single [Shot 1] with no cut timestamp. The cuts in this
#      story happen between docker runs, not inside them.
#   2. detailed_description runs ~200-250 words, not the guide's 350-500. That
#      range is for a full multi-shot video; one ~3.75-second shot carries far
#      less information. This file sits in the range its siblings actually
#      measure at (josy-beach-drive 201-245, josy-bat-dream 197-250).
#
# ---------------------------------------------------------------------------
# SCENE BREAKDOWN - the draft's seven beats over eight scenes
# ---------------------------------------------------------------------------
# Six of the drafted beats fit one shot each. Draft 6 does not, and is split
# across two scenes, so the film runs eight:
#
#   draft 1 (couch, phone, she types)   -> 1  typing-on-the-couch
#   draft 2 (close-up, the group chat)  -> 2  the-group-chat
#   draft 3 (split-screen call, agreed) -> 3  the-video-call
#   draft 4 (promenade pan, no humans)  -> 4  the-promenade
#   draft 5 (josy-skate POV, she pushes)-> 5  the-push
#   draft 6 (wide side view, all three) -> 6  pipa-comes-up
#                                          7  preta-makes-it-three
#   draft 7 (indoors, wakes, sleeps)    -> 8  waking
#
# Two scenes are raised to video_frames: 100 (sd-cli rounds that to 107,
# ~4.46s) because they carry sequential beats rather than one continuous motion:
#
#   4  the-promenade - the pan has to reach three separate pieces of business
#                      (the volleyball game, the walking cats, the skaters).
#   8  waking        - wake, scan, smile, settle. Four beats on a locked-off
#                      camera, which is what makes the extra ~0.7s buy real
#                      room rather than dead air.
#
# Compare scene 5, where the push and the roll-away are one continuous motion
# rather than two events, and 90 is enough.
#
# 100 is the ceiling, not a starting point: 110 rounds to 124 frames and takes
# the GPU out with DeviceLost (see scripts/h3/butterfly-dream.yaml).
#
# 100 is also not always reachable. Draft 6 - Josy rides in, THEN Pipa arrives,
# THEN Preta does - needed the extra ~0.7s, because at 90 the second and third
# arrivals land on top of each other. It got it, and then died three times with
# DeviceLost inside "generate_video 544x960x107": four refs at 107 frames is
# past what this box holds, even though scenes 4 and 8 take 107 fine on one and
# two refs. So it is two scenes of 90 with two arrivals apiece instead, which
# buys the beats more room than 100 ever did. The frame ceiling is not a single
# number - it moves with the reference count.
#
# ---------------------------------------------------------------------------
# THE <Picture N> CONTRACT - read before editing any prompt
# ---------------------------------------------------------------------------
# Refs reach sd-cli as: chained previous frame first (render() inserts it at
# index 0), then continuity.anchors in order, then the scene's own ref_images.
# With one anchor, that fixes the labels as:
#
#   scene 1 (chain off, 1 scene ref):
#     <Picture 1> = assets/josy-reference.jpg
#     <Picture 2> = assets/josy-phone.jpeg
#
#   scenes 2, 3, 7 (chained, 2 scene refs):
#     <Picture 1> = the previous scene's last frame
#     <Picture 2> = assets/josy-reference.jpg
#     <Picture 3> = assets/pipa.jpeg
#     <Picture 4> = assets/preta.jpeg
#
#   scene 4 (chain off, no scene refs):
#     <Picture 1> = assets/josy-reference.jpg
#
#   scenes 5 and 6 (chained, 1 scene ref):
#     <Picture 1> = the previous scene's last frame
#     <Picture 2> = assets/josy-reference.jpg
#     <Picture 3> = assets/josy-skate.jpeg  (scene 5)
#                 = assets/pipa.jpeg        (scene 6)
#
#   scene 8 (chain off, 1 scene ref):
#     <Picture 1> = assets/josy-reference.jpg
#     <Picture 2> = assets/josy-phone.jpeg
#
# If you flip chain_from_previous on any scene, every label in it shifts by one.
#
# Three scenes deliberately break the chain:
#   scene 1 - nothing to chain from.
#   scene 4 - the cut from inside the phone to the promenade. Chaining a glowing
#             screen into a wide sunlit exterior drags UI panels and screen
#             glare across the establishing shot.
#   scene 8 - the cut from dream to waking, and the same trick josy-bat-dream
#             plays at its scene 9. Chaining the promenade in would drag the sea
#             and the sky into the shot that exists to prove neither happened.
#             josy-phone restates the indoor plate from a clean frame instead,
#             which is also what makes 8 rhyme with 1 on screen - both scenes
#             are chain-off with the same two refs in the same order.
#
# <Subject N> numbering is per scene, in order of first appearance, as the guide
# specifies, so the same dog is <Subject 1> in scene 1 and <Subject 2> in scene
# 3. That is correct - each scene is an independent generation.
#
# retention_analysis only carries lines for reference-backed labels, per the
# guide's "one line for each reference label". Invented content - the promenade,
# the other pets on it, the chat UI - gets a subject_definitions entry for
# consistency across scenes and no retention line. Do not invent a marker for
# it; fully_preserved against nothing is what makes the model start hunting for
# it in the anchor.
#
# ---------------------------------------------------------------------------
# THE CAST - three animals, three photos, one of them a collage
# ---------------------------------------------------------------------------
# josy-reference.jpg  the global anchor: Josy full-body, sitting, clean light.
#                     Fixes her build, coat, white chest blaze and bat ears.
# pipa.jpeg           Pipa, head-and-shoulders against a white wall, front paws
#                     folded. A face plate only - it says nothing about her body
#                     below the chest, so every scene that needs her standing or
#                     riding marks her partially_preserved and describes the
#                     body outright.
# preta.jpeg          Preta. **This file is a four-panel photo collage** - four
#                     separate shots of the same small dog in a 2x2 grid with
#                     white gutters, and one panel includes a human hand under
#                     her chin. Every prompt that uses it says so and marks it
#                     partially_preserved, naming her markings as the thing that
#                     carries over. Without that line the model reproduces the
#                     grid: you get a split-screen inside the split-screen in
#                     scene 3, and four Pretas on the promenade in scene 7. The
#                     hand has to be excluded by name too, or it turns up in a
#                     film whose whole premise is that there are no humans.
#
# josy-phone.jpeg and josy-skate.jpeg are situation plates rather than cast:
#
# josy-phone.jpeg     the grey woven couch with the thick rolled arm, the white
#                     finned radiator behind it, and the magenta-cased phone
#                     lying screen-up on the seat cushion. Used in scenes 1 and
#                     7. Scene 1 marks it partially_preserved for one reason
#                     only: in the photo she looks straight down the lens, and
#                     the brief wants her looking at the phone instead. Her gaze
#                     is an action, not a retention loss, so the prompt states
#                     the redirect in detailed_description as well.
# josy-skate.jpeg     Josy standing four-square on a cruiser deck - black grip
#                     tape with a tan outlined rounded-rectangle graphic, wood
#                     veneer along the nose - shot from high and behind. Used in
#                     scene 5 for its VIEWPOINT and its BOARD, which is why it
#                     gets a standalone <Picture 3> entry (the guide's
#                     shot-planning anchor case, ref-en.txt section 2.2) as well
#                     as being cited inside the board subject. Its indoor
#                     herringbone parquet, white skirting and black shelving are
#                     named as the parts that do NOT carry over.
#
# ---------------------------------------------------------------------------
# PORTRAIT, INCLUDING THE "WIDE SIDE VIEW"
# ---------------------------------------------------------------------------
# 544x960 throughout, as every other script in scripts/h3/, and assembly pads
# rather than stretches - so a landscape scene would pillarbox in the middle of
# the movie. josy-skate.jpeg is a 16:9 frame and draft 6 is written as a "wide
# side view"; both are held as camera ANGLE, not as crop. Scenes 6 and 7 get
# their width from a wide lens and a low camera, with Josy in full side profile
# across the lower third and the railing, the sea and a deep sky stacked over
# her. That stack is what a tall frame is actually good at.
#
# ---------------------------------------------------------------------------
# NO HUMANS - say it in every exterior
# ---------------------------------------------------------------------------
# The premise of scenes 4-6 is a promenade with only animals on it, and every
# frame of beach-promenade footage the model has ever seen is full of people.
# All three exteriors carry an explicit closing line naming humans, human legs,
# hands, faces and shadows as absent. Do not trim it to "no people" - the
# shadows and the disembodied legs are what actually come back.
#
# ---------------------------------------------------------------------------
# NOBODY SPEAKS
# ---------------------------------------------------------------------------
# No scene has dialogue and no <d> block appears anywhere, matching the rest of
# scripts/h3/. The agreement in scene 3 is carried by body language, barking and
# chirping, and a row of stickers popping up over the call UI - not by lip-sync.
# Talking animal mouths are the one thing this model does badly enough to break
# a film. If you want the beat louder, add stickers, not speech.
#
# On-screen text (scenes 2 and 3) is held to single short uppercase words -
# BEACH, SKATE, YES, PIPA, PRETA. The model garbles anything longer, and a
# garbled six-word sentence reads as a render fault where a garbled six-letter
# word reads as a phone screen shot slightly out of focus.
#
# ---------------------------------------------------------------------------
# KEEPING HER FEMALE - don't drop these when editing
# ---------------------------------------------------------------------------
# The phrase is "compact and petite, with a narrow finely-boned head, a slender
# neck, a light delicate frame", restated in BOTH subject_definitions and at her
# first appearance in detailed_description, per the guide's rule. Same wording as
# the sibling scripts, on purpose.
name: josy-skate-dream

model:
  root: /home/erika/Projects/ai-models          # host dir, mounted read-only at /models
  diffusion_model: minimax-h3/minimax_h3_ref2va_pruned-Q8_0.gguf
  llm:             minimax-h3/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  vae:             minimax-h3/minimax_h3_video_vae_fp16.safetensors
  audio_vae:       minimax-h3/minimax_h3_audio_vae_fp32.safetensors

docker:
  image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan
  devices: [/dev/dri/card1, /dev/dri/renderD128, /dev/kfd]
  # Your UID owns the GPU device ACLs, so the container can drop root and still
  # reach the GPU - which keeps rendered clips owned by you instead of root.
  run_as_current_user: true

defaults:
  # Portrait, as every other script in scripts/h3/. See the PORTRAIT note in the
  # header for why the "wide side view" of scenes 6 and 7 still renders 544x960.
  width: 544
  height: 960
  fps: 24
  # ~3.75s. sd-cli rounds this UP, and not by one or two: measured on this box
  # at 544x960, 90 stays 90, 100 becomes 107, 110 becomes 124. Check the
  # "generate_video 544x960xN" line in the log for what you actually got.
  video_frames: 90
  cfg_scale: 1.0
  seed: 42
  negative_prompt: ""       # no effect at cfg_scale 1.0 - CFG is off, so the
                            # negative prompt is never evaluated. Steer with
                            # positive description instead.
  # MUST stay empty for H3-structured prompts. full_prompt() appends the suffix
  # as ". <suffix>" at the very end - which here is the end of
  # non_diegetic_music, so the style text would read as part of the score. The
  # look lives in each scene's detailed_description opening line instead.
  style_suffix: ""
  # --mmap matters: ~39 GB of weights reload on every scene, and the page cache
  # keeps them warm between runs. The VAE stays on the GPU on purpose -
  # "--backend vae=cpu" made the audio decode at the end of each scene slower.
  extra_args: ["--diffusion-fa", "--mmap", "--backend", "te=cpu"]

continuity:
  # One anchor, passed to every scene: the clean full-body shot that fixes her
  # build, coat, white chest blaze and bat ears. Scene 4 does not show her at
  # all and still gets it - anchors are global - so that prompt says in so many
  # words that no French bulldog is anywhere in the shot. Without that the
  # anchor keeps trying to walk one into the pan.
  #
  # Pipa and Preta are deliberately NOT anchors. They appear in three scenes out
  # of seven, and passing them to scenes 1, 4, 5 and 7 puts a tabby on the couch
  # and a small black-and-tan dog in the corner of the dog-bed shot.
  anchors:
    - josy-reference.jpg

  # Reference *videos* stay empty on purpose: on this box a --ref-video either
  # crashes the GPU with DeviceLost or drags the whole pipeline onto the CPU.
  # Reference images do not - chaining has always used them.
  anchor_videos: []

  chain_from_previous: true

output:
  container: mp4             # mp4 (h264/aac) or webm (vp9/opus)
  audio: keep                # keep the model's generated audio, or "strip"
  music: null                # optional file under assets/, mixed under the movie
  music_gain_db: -18

scenes:
  # =========================================================================
  # DRAFT SCENE 1 - she types
  # =========================================================================

  # -------------------------------------------------------------------------
  # 1. Typing on the couch.
  # -------------------------------------------------------------------------
  # The only scene at the front with chaining off, so the labels here are
  # anchor-then-scene-refs. It establishes three things - the room, the dog and
  # the phone - and does exactly one action, which is the paw going down on the
  # glass. The brief's one change from the photo is her eyeline: "she does not
  # look at the camera at any point" is stated in detailed_description because
  # the plate has her staring straight down the lens and the model will hold
  # that pose all the way through the shot otherwise.
  - id: typing-on-the-couch
    chain_from_previous: false
    ref_images:
      - josy-phone.jpeg
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1> and <Picture 2>: compact and petite, with a narrow finely-boned head, a slender neck, and a light delicate frame, a short dark brindle coat that reads almost black, faint lighter brindle striping along her flanks, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, a short deeply wrinkled muzzle, and a flat black nose.
      <Subject 2> is the couch and room in <Picture 2>: a grey woven-fabric couch with a thick rolled arm on the right and a matching back cushion, standing against a plain white wall with a white vertical-finned radiator behind it, in soft indoor daylight falling from the left.
      <Subject 3> is the smartphone in <Picture 2>: a slim modern phone in a bright magenta-pink rubber case, lying flat and screen-up on the seat cushion, its glass dark and slightly smeared with fingerprints.

      summary:
      [reference generation] The target video holds on <Subject 1> lying against the rolled arm of <Subject 2> with <Subject 3> on the cushion in front of her paws. She looks down at the phone, reaches out with her right front paw and taps the screen awake, and goes on tapping at it with small precise dabs of her toes. <Picture 1> supplies her build and coat, <Picture 2> the couch, the room and the phone.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the petite finely-boned build, near-black brindle coat, white chest blaze, large upright bat ears, wide round dark eyes and short wrinkled muzzle of <Picture 1> and <Picture 2> are retained, as is her position lying propped against the rolled arm.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the grey woven couch, the thick rolled arm, the white finned radiator, the plain white wall and the soft daylight from the left of <Picture 2> are retained.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the slim phone, its bright magenta-pink rubber case and its position lying screen-up on the seat cushion in front of her front paws are retained from <Picture 2>.

      detailed_description:
      The target video is photorealistic live-action footage in a warm quiet domestic style, shot on a medium lens at couch height in soft indoor daylight, with a shallow depth of field and fine film grain.
      [Shot 1] The shot opens on <Subject 2>, the grey woven couch with its thick rolled arm and the white finned radiator on the wall behind. <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze and large upright bat ears, lies propped against the arm with both front paws out on the seat cushion. <Subject 3> lies screen-up on the cushion just in front of her toes. Her head is angled down over it and her round dark eyes stay on the glass; she does not look at the camera at any point in this shot. Her ears swivel once. She shifts her weight forward, lifts her right front paw and sets the pad down flat on the dark glass. The screen wakes, and a faint cool glow comes up onto the underside of her wrinkled muzzle and the white of her chest. She taps at it - four small precise dabs of the toes, her head dipping a little lower with each one, the tip of her pink tongue showing between her lips. The camera pushes in very slowly. Her ears come forward, she taps once more and lifts the paw clear, and the lit screen holds under her chin. Nobody else is in the room.

      overall_soundscape: Quiet living-room tone throughout, with a faint tick from the radiator and a soft muffled street hum beyond the wall. Small blunt claw taps on phone glass, a low electronic tap-tone from the handset each time, snuffling flat-faced breathing close to the microphone, and woven fabric shifting under her weight. No speech.

      non_diegetic_music: A light curious pizzicato string figure at a moderate walking tempo with a soft marimba doubling the phrase, small in scale and unhurried, brightening a step when the screen lights up.

  # =========================================================================
  # DRAFT SCENE 2 - inside the phone
  # =========================================================================

  # -------------------------------------------------------------------------
  # 2. The group chat.
  # -------------------------------------------------------------------------
  # Chained, and the chain does real work here: <Picture 1> is the lit screen
  # under her chin, so the push-in is a continuation rather than a cut. pipa and
  # preta come in as scene refs for the avatars only - both are marked
  # partially_preserved to say that only the heads are used, cropped into small
  # circles, which is also what stops the model rendering Preta's four-panel
  # grid inside a 40-pixel avatar.
  #
  # On-screen text is four short uppercase words. See the header.
  - id: the-group-chat
    ref_images:
      - pipa.jpeg
      - preta.jpeg
    prompt: |-
      subject_definitions:
      <Subject 1> is the smartphone screen continuing from <Picture 1>: a slim phone in a bright magenta-pink rubber case, seen close and slightly angled, its glass carrying fine pixel texture, a faint fingerprint smear and a soft window reflection across one corner.
      <Subject 2> is the messaging app filling that screen: a clean white chat thread with a pale green header bar at the top, incoming messages as light grey rounded bubbles on the left with a small round profile photo beside each, and outgoing messages as pale green rounded bubbles on the right, with a text field and a round green send button along the bottom edge.
      <Subject 3> is the brown tabby cat in <Picture 3>, used as one of the small round profile photos: a warm brown mackerel tabby with dark striping over tan-brown fur, an M-shaped marking across her forehead, large triangular ears with pale pink insides, wide round yellow-green eyes rimmed in dark fur, a brick-pink nose and a white chin.
      <Subject 4> is the small black-and-tan dog in <Picture 4>, used as another of the small round profile photos: a short-coated senior dog with a glossy black back and skull, rust-tan pips above each eye, tan cheeks and muzzle going grey around the mouth, a tan chest and tan legs, and very large round protruding dark eyes.
      <Subject 5> is the paw of the French bulldog established in <Picture 1> and <Picture 2>, near-black and blunt-toed, entering the frame from the top edge.

      summary:
      [reference generation] The target video pushes in from <Picture 1> until <Subject 1> fills the frame, and holds on the thread in <Subject 2>: grey bubbles arriving from <Subject 3> and <Subject 4>, a typing indicator pulsing, and <Subject 5> coming down onto the send button so a green bubble slides up. <Picture 2> supplies the bulldog, <Picture 3> the tabby profile photo, <Picture 4> the black-and-tan profile photo.

      retention_analysis:
      <Picture 1> ([Shot 1] opening frame): fully_preserved - the couch, the magenta-cased phone, its position on the cushion and the soft indoor daylight are retained at the start of the shot, before the camera closes onto the screen.
      <Subject 3> (appears in [Shot 1]): partially_preserved - the warm brown mackerel tabby markings, the forehead M, the large triangular pink-lined ears, the round yellow-green eyes, the brick-pink nose and the white chin of <Picture 3> are retained; only her head is used, cropped into a small circular profile photo, and her body and the white wall behind her are not shown.
      <Subject 4> (appears in [Shot 1]): partially_preserved - the glossy black coat, the rust-tan eyebrow pips, the tan cheeks and greying muzzle and the very large round dark eyes of <Picture 4> are retained; <Picture 4> is a four-panel photo collage, and only one head is used, cropped into a small circular profile photo. No grid, no panel divisions, no white gutters and no human hand appear anywhere in the target video.
      <Subject 5> (appears in [Shot 1]): fully_preserved - the near-black brindle coat and blunt dark toes of the bulldog in <Picture 2> are retained on the paw that enters the frame.

      detailed_description:
      The target video is photorealistic live-action footage in a warm quiet domestic style, shot macro on a close lens in soft indoor daylight, with a very shallow depth of field and fine film grain.
      [Shot 1] The shot opens exactly on <Picture 1> and the camera closes fast and smoothly onto the lit screen of <Subject 1> until the magenta case edge frames the picture and the glass fills it, held at a slight angle so a soft window reflection lies across one corner and the pixel texture and fingerprint smears are visible. <Subject 2> resolves into focus: the pale green header bar, three small round profile photos tucked beside it, and a stack of chat bubbles below. A light grey bubble sits on the left beside the circular photo of <Subject 3>, the brown tabby with the forehead M and the round yellow-green eyes, reading BEACH. Under it another grey bubble beside the circular photo of <Subject 4>, the black-and-tan dog with the rust-tan eyebrow pips and the huge dark eyes, reading SKATE. A small grey typing indicator pulses below them, three dots rising and falling in turn. <Subject 5>, the near-black blunt-toed paw, comes down from the top edge of the frame and presses the round green send button. A pale green bubble slides up the right side of the thread reading YES, and the whole stack shifts upward to make room. The screen glow flickers once on the dark toes as the paw lifts away.

      overall_soundscape: Quiet living-room tone throughout, with a faint radiator tick and a soft muffled street hum. Two short soft message chimes as the grey bubbles land, a blunt claw tapping once on glass, a light outgoing whoosh as the green bubble sends, and snuffling flat-faced breathing close over the handset. No speech.

      non_diegetic_music: The light pizzicato string and marimba figure continues at the same walking tempo, tightening to short staccato notes that land with each arriving bubble and lifting a clear step higher on the send.

  # -------------------------------------------------------------------------
  # 3. The video call.
  # -------------------------------------------------------------------------
  # Chained again, so the call opens on the same screen the chat was on. The
  # split is TOP AND BOTTOM, not left and right: in a 544x960 frame a vertical
  # divider gives each animal a 272-pixel-wide sliver and neither face survives
  # it. Horizontal halves give both of them a near-square tile.
  #
  # The agreement is barks, chirps and a row of stickers - no lip-sync. See the
  # NOBODY SPEAKS note in the header before adding any.
  - id: the-video-call
    ref_images:
      - pipa.jpeg
      - preta.jpeg
    prompt: |-
      subject_definitions:
      <Subject 1> is the smartphone screen continuing from <Picture 1>: a slim phone in a bright magenta-pink rubber case, seen close and slightly angled, its glass carrying fine pixel texture and a soft window reflection across one corner.
      <Subject 2> is the video-call interface filling that screen: two camera feeds stacked as equal horizontal halves with a thin dark seam between them and softly rounded outer corners, a small green call timer floating at the top, a lowercase name label in the bottom-left corner of each half, and a round red end-call button centred along the bottom edge.
      <Subject 3> is the brown tabby cat in <Picture 3>, filling the upper half of <Subject 2>: a warm brown mackerel tabby with dark striping over tan-brown fur, an M-shaped marking across her forehead, large triangular ears with pale pink insides and fine white tufts, wide round yellow-green eyes rimmed in dark fur, a brick-pink nose, long white whiskers and a white chin.
      <Subject 4> is the small black-and-tan dog in <Picture 4>, filling the lower half of <Subject 2>: a short-coated senior dog with a glossy black back and skull, rust-tan pips above each eye, tan cheeks and a greying muzzle, a tan chest and tan front legs, small semi-folded ears and very large round protruding dark eyes.
      <Subject 5> is the paw of the French bulldog established in <Picture 1> and <Picture 2>, near-black and blunt-toed, resting along the bottom edge of the frame.

      summary:
      [reference generation] The target video holds close on <Subject 1>, where the chat has become the two-way call of <Subject 2>: <Subject 3> in the upper half on a pale couch back and <Subject 4> in the lower half on a white tiled floor, both reacting with rising excitement as a row of small stickers - a wave, a sun and a skateboard - pops up over the seam. <Picture 2> supplies the bulldog, <Picture 3> the tabby, <Picture 4> the black-and-tan dog.

      retention_analysis:
      <Picture 1> ([Shot 1] opening frame): fully_preserved - the close angled framing of the magenta-cased phone, the screen position in frame and the soft indoor daylight are retained from the first frame onward.
      <Subject 3> (appears in [Shot 1]): partially_preserved - the warm brown mackerel tabby striping, the forehead M, the large pink-lined triangular ears, the round yellow-green eyes, the brick-pink nose, the long white whiskers and the white chin of <Picture 3> are retained, as is her front-on framing against a plain pale background; her body below the chest is not defined by <Picture 3> and is shown here sitting upright with her front paws folded on a pale couch back.
      <Subject 4> (appears in [Shot 1]): partially_preserved - the glossy black coat, the rust-tan eyebrow pips, the tan cheeks and greying muzzle, the tan chest and legs and the very large round dark eyes of <Picture 4> are retained. <Picture 4> is a four-panel photo collage: only a single whole dog appears in the target video, sitting on a white tiled floor, and no grid, no panel divisions, no white gutters and no human hand appear anywhere.
      <Subject 5> (appears in [Shot 1]): fully_preserved - the near-black brindle coat and blunt dark toes of the bulldog in <Picture 2> are retained on the paw resting at the bottom edge.

      detailed_description:
      The target video is photorealistic live-action footage in a warm quiet domestic style, shot macro on a close lens in soft indoor daylight, with a very shallow depth of field and fine film grain.
