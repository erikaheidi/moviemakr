# josy-beach-drive - a ten-scene short. Josy cruises a beach city inhabited
# only by dogs, winks at the camera... and wakes up under a table on a real
# beach, with human legs all around her. It was a nap.
#
#   ./moviemakr.py render scripts/h3/josy-beach-drive.yaml --dry-run
#   ./moviemakr.py render scripts/h3/josy-beach-drive.yaml --only 1
#   ./moviemakr.py render scripts/h3/josy-beach-drive.yaml
#   ./moviemakr.py status scripts/h3/josy-beach-drive.yaml
#
# Prompts are written through the `h3-prompt-writing` skill in full-reference
# (Ref2VA) form - see .claude/skills/h3-prompt-writing/references/ref-en.txt.
# Same two adaptations as scripts/h3/josy-house-party.yaml, because moviemakr
# generates one shot per docker run rather than a whole movie:
#
#   1. Every scene is a single [Shot 1] with no cut timestamp. The cuts in this
#      story happen between docker runs, not inside them.
#   2. detailed_description runs ~130-180 words, not the guide's 350-500. That
#      range is for a full multi-shot video; one ~3.75-second shot carries far
#      less information.
#
# ---------------------------------------------------------------------------
# SCENE BREAKDOWN - why ten scenes for a four-beat draft
# ---------------------------------------------------------------------------
# video_frames is pinned at 90 (~3.75s) everywhere, so the only way to give a
# beat more time is to give it its own scene. The four drafted scenes were split
# where they carried more action than 3.75s can hold:
#
#   draft 1 (car, front view, honk)  -> 1 at-the-wheel, 2 the-honk
#   draft 2 (drives off, turns, city)-> 3 pulling-away, 4 the-cruise, 5 dog-city
#   draft 3 (looks at camera, winks) -> 6 the-look, 7 the-wink
#   draft 4 (wakes under the table)  -> 8 waking, 9 hello, 10 back-to-sleep
#
# The wink got its own scene deliberately: it is a single small facial action,
# and packing "turn head, smile, wink, turn back" into one shot is how a wink
# turns into a blink. Same reasoning for the honk, which is the joke of the
# opening and needs the paw lift to actually read.
#
# ---------------------------------------------------------------------------
# THE <Picture N> CONTRACT - read before editing any prompt
# ---------------------------------------------------------------------------
# Refs reach sd-cli as: chained previous frame first (render() inserts it at
# index 0), then continuity.anchors in order, then any scene ref_images. With
# one anchor, that fixes the labels as:
#
#   scene 1 (chain off, 2 refs):
#     <Picture 1> = assets/josy-reference.jpg
#     <Picture 2> = assets/josy-car.jpg
#
#   scenes 2-7 (chained, 1 anchor, no scene refs):
#     <Picture 1> = the previous scene's last frame
#     <Picture 2> = assets/josy-reference.jpg
#
#   scene 8 (chain off, 3 refs):
#     <Picture 1> = assets/josy-reference.jpg
#     <Picture 2> = assets/josy-beach-table.jpg
#     <Picture 3> = assets/josy-beach.jpg
#
#   scenes 9-10 (chained, 4 refs):
#     <Picture 1> = the previous scene's last frame
#     <Picture 2> = assets/josy-reference.jpg
#     <Picture 3> = assets/josy-beach-table.jpg
#     <Picture 4> = assets/josy-beach.jpg
#
# If you flip chain_from_previous on any scene, every label in it shifts by one.
#
# Two scenes deliberately break the chain:
#   scene 1  - nothing to chain from.
#   scene 8  - this is the cut from dream to reality. Chaining scene 7's wink
#              close-up in would drag the pink car and the dog city into the
#              shot that exists to prove they were never there. The beach refs
#              start it clean instead.
#
# <Subject N> numbering is per scene, in order of first appearance, as the guide
# specifies. The same dog is <Subject 1> in scene 1 and <Subject 2> in scene 5;
# that is correct, each scene is an independent generation.
#
# ---------------------------------------------------------------------------
# THE CAR - assets/josy-car.jpg is a shape reference, not a look reference
# ---------------------------------------------------------------------------
# The photo is a weathered grey concrete moulded car on the sand. The brief is a
# real drivable convertible in glossy pink at that same small size and in that
# same rounded shape. So scene 1 marks it partially_preserved and names exactly
# what survives (bulbous body, domed hood, curved fenders, round headlamps,
# small scale) and what does not (concrete, closed body, static prop).
#
# josy-car.jpg is passed to scene 1 ONLY. Handing it to the driving scenes as
# well would keep pulling the car back toward grey concrete; scenes 2-7 get the
# car from the chained frame plus a full text description in every prompt.
#
# ---------------------------------------------------------------------------
# NO HUMANS - until scene 8, where that is the whole point
# ---------------------------------------------------------------------------
# Scenes 1-7 state "no humans appear at any point" explicitly and populate the
# background with dogs walking upright on their hind legs. Scenes 8-10 are the
# waking world and are full of human legs, boots and jeans - the reveal only
# works if the dream half is clean.
#
# ---------------------------------------------------------------------------
# KEEPING HER FEMALE - don't drop these when editing
# ---------------------------------------------------------------------------
# Carried over from scripts/h3/josy-house-party.yaml, where an early take
# rendered a male dog despite a dozen "she"s. Grammatical gender is weak
# conditioning for this model, and a negative prompt cannot fix it (cfg_scale is
# 1.0, so CFG is off and negative_prompt is never evaluated). What carries it:
#
#   1. Build, not pronouns. "small, compact, petite, narrow finely-boned head,
#      slender neck, light delicate frame" - male frenchies have broader,
#      blockier skulls and thicker necks, and the model has learned that
#      dimorphism. Restated in BOTH subject_definitions and at her first
#      appearance in detailed_description, per the guide's rule.
#   2. No angle from behind or below. Every scene pins the camera to front,
#      three-quarter or profile framing at shoulder or bumper height. Scene 3
#      (the car pulls away from the lens) and scene 10 (she lies down) are the
#      two that need this most.
name: josy-beach-drive

model:
  root: /home/erika/Projects/ai-models          # host dir, mounted read-only at /models
  diffusion_model: minimax-h3/minimax_h3_ref2va_pruned-Q8_0.gguf
  llm:             minimax-h3/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  vae:             minimax-h3/minimax_h3_video_vae_fp16.safetensors
  audio_vae:       minimax-h3/minimax_h3_audio_vae_fp32.safetensors

docker:
  image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan
  devices: [/dev/dri/card1, /dev/dri/renderD128, /dev/kfd]
  # Your UID owns the GPU device ACLs, so the container can drop root and still
  # reach the GPU - which keeps rendered clips owned by you instead of root.
  run_as_current_user: true

defaults:
  width: 544
  height: 960
  fps: 24
  # ~3.75s. sd-cli rounds this UP, and not by one or two: measured on this box
  # at 544x960, 90 stays 90, 100 becomes 107, 110 becomes 124. Check the
  # "generate_video 544x960xN" line in the log for what you actually got. Held
  # at 90 for every scene here; extra time comes from extra scenes instead.
  video_frames: 90
  cfg_scale: 1.0
  seed: 42
  negative_prompt: ""       # no effect at cfg_scale 1.0 - CFG is off, so the
                            # negative prompt is never evaluated. Steer with
                            # positive description instead.
  # MUST stay empty for H3-structured prompts. full_prompt() appends the suffix
  # as ". <suffix>" at the very end - which here is the end of
  # non_diegetic_music, so the style text would read as part of the score. The
  # look lives in each scene's detailed_description opening line instead.
  style_suffix: ""
  # --mmap matters: ~39 GB of weights reload on every scene, and the page cache
  # keeps them warm between runs. The VAE stays on the GPU on purpose -
  # "--backend vae=cpu" made the audio decode at the end of each scene slower.
  extra_args: ["--diffusion-fa", "--mmap", "--backend", "te=cpu"]

continuity:
  # One anchor, passed to every scene: the clean full-body shot that fixes her
  # build, coat, white chest blaze and bat ears. Scenes 3-5 push her far enough
  # from the lens that the chained frame alone would start losing her face, and
  # scene 8 has no usable chain at all.
  anchors:
    - josy-reference.jpg

  # Reference *videos* stay empty on purpose: on this box a --ref-video either
  # crashes the GPU with DeviceLost or drags the whole pipeline onto the CPU.
  # Reference images do not - chaining has always used them.
  anchor_videos: []

  chain_from_previous: true

output:
  container: mp4             # mp4 (h264/aac) or webm (vp9/opus)
  audio: keep                # keep the model's generated audio, or "strip"
  music: null                # optional file under assets/, mixed under the movie
  music_gain_db: -18

scenes:
  # =========================================================================
  # DRAFT SCENE 1 - the car, front view, the honk
  # =========================================================================

  # -------------------------------------------------------------------------
  # 1. At the wheel.
  # -------------------------------------------------------------------------
  # The only scene that sees josy-car.jpg, and the only one with chaining off,
  # so the labels here are anchor-then-scene-ref. This shot has to establish
  # three things at once - her, the pink car, and a beach city with no humans in
  # it - so the action is deliberately small: she just sits there being pleased.
  - id: at-the-wheel
    chain_from_previous: false
    ref_images: [josy-car.jpg]
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog in <Picture 1> and <Picture 2>: compact and petite, with a narrow finely-boned head, a slender neck, and a light delicate frame, a short dark brindle coat that reads almost black, faint lighter brindle striping along her flanks, a white blaze covering the centre of her chest, large upright bat ears, wide round dark eyes, a short deeply wrinkled muzzle, and a flat black nose. A thick heavy gold curb-link chain hangs around her neck, as in <Picture 2>.
      <Subject 2> is the little car in <Picture 2>, rebuilt as a real drivable road car at the same small size and in the same rounded shape: a bulbous open-top two-seater with a domed hood, separate curved fenders, round headlamps set into the fenders, and a low tapering tail, finished in glossy candy-pink paint with chrome bumpers, chrome hubcaps on four real rubber tyres, a small chrome-rimmed windscreen, a white leather bench seat, and a slim white steering wheel with a chrome horn button at its centre.
      <Subject 3> is the beach dog city: a wide pale-concrete seafront sidewalk edged with low pastel-painted kiosks and leaning palms, dry white sand and a calm turquoise sea beyond it, under bright late-afternoon sun. No humans live here; every inhabitant is a dog, walking upright on its hind legs.

      summary:
      [reference generation] The target video is a static front-on shot of <Subject 1> sitting behind the wheel of <Subject 2>, parked on the seafront sidewalk of <Subject 3>, both front paws on the steering wheel, tongue lolling, visibly pleased with herself. <Picture 1> supplies her build, coat and full-body proportions; <Picture 2> supplies her face, her gold chain, and the shape and scale of the car.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - the petite finely-boned build, near-black brindle coat, white chest blaze, large upright bat ears, wide round dark eyes, short wrinkled muzzle and thick gold curb-link chain are retained.
      <Subject 2> (appears in [Shot 1]): partially_preserved - the bulbous rounded body, domed hood, separate curved fenders, round headlamps and small scale of the moulded car in <Picture 2> are retained; its weathered grey concrete surface becomes glossy candy-pink paint with chrome and real tyres, and the solid moulded prop becomes a working open-top convertible.
      <Subject 3> (appears in [Shot 1]): weak_reference - only the dry pale sand and bright coastal daylight of <Picture 2> carry over; the concrete sidewalk, kiosks, palms, sea and the upright dog population are new.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, sunlit and saturated, shot on a wide lens at bumper height in warm late-afternoon light with long soft shadows and fine film grain.
      [Shot 1] A static front-on shot, the camera low and level with the chrome bumper. <Subject 2>, the small glossy candy-pink convertible, sits square in the centre of the vertical frame on the pale concrete sidewalk of <Subject 3>, its domed hood and round headlamps filling the lower half. Behind the little chrome-rimmed windscreen sits <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze and large upright bat ears, the thick gold curb-link chain heavy across her chest. She sits upright on the white leather bench with both front paws planted flat on the slim white steering wheel, shoulders squared to the camera. Her mouth is open in a wide happy pant and her pink tongue hangs loose over her lower jaw. Her ears swivel once toward the sea, her chin lifts, and she shifts her grip on the wheel. Behind her the sidewalk runs away toward leaning palms and low pastel kiosks, with white sand and turquoise water beyond; two dogs stroll upright on their hind legs through the soft background blur. No humans appear at any point.

      overall_soundscape: Open seafront ambience throughout - gentle surf breaking at a distance, gulls calling overhead, a steady breeze moving through palm fronds. Claws tick lightly on the plastic steering wheel, and a close rhythmic flat-faced panting sits just in front of the mix. No speech.

      non_diegetic_music: A bright ukulele strum with brushed shaker and a warm reverb-heavy surf-guitar line at an easy mid tempo, sunny and unhurried, holding an even dynamic to the end.

  # -------------------------------------------------------------------------
  # 2. The honk.
  # -------------------------------------------------------------------------
  # The brief specifies the LEFT paw. Front-on, her left paw is on the RIGHT of
  # frame, so the prompt says both - the model follows screen direction far more
  # reliably than anatomical left.
  - id: the-honk
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog established in <Picture 1> and <Picture 2>: compact and petite, with a narrow finely-boned head, a slender neck and a light delicate frame, a near-black brindle coat, a white blaze on the centre of her chest, large upright bat ears, wide round dark eyes, a short wrinkled muzzle, and a thick heavy gold curb-link chain around her neck.
      <Subject 2> is the small glossy candy-pink open-top convertible in <Picture 1>, with its domed hood, curved fenders, round headlamps, chrome bumpers, small chrome-rimmed windscreen, white leather bench seat and slim white steering wheel with a chrome horn button at its centre.
      <Subject 3> is the beach dog city in <Picture 1>: a pale-concrete seafront sidewalk with pastel kiosks, leaning palms, white sand and turquoise sea, populated only by dogs walking upright on their hind legs.

      summary:
      [reference generation] The target video continues directly from <Picture 1>: <Subject 1> sits at the wheel of <Subject 2> on the sidewalk of <Subject 3>, lifts her left front paw off the wheel, presses the chrome horn button twice, and grins wider as the horn sounds. <Picture 1> supplies the exact framing, car and lighting; <Picture 2> supplies her build and coat.

      retention_analysis:
      <Picture 1> ([Shot 1] opening frame): fully_preserved - the low front-on bumper-height framing, the car's position in the centre of frame, the sidewalk, palms, sea and warm late-afternoon light are retained from the first frame onward.
      <Subject 1> (appears in [Shot 1]): fully_preserved - the petite finely-boned build, near-black brindle coat, white chest blaze, upright bat ears, wrinkled muzzle and gold curb-link chain are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the candy-pink paint, domed hood, round headlamps, chrome trim, white bench seat and white steering wheel are retained.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the concrete sidewalk, pastel kiosks, leaning palms, sand, sea and upright background dogs are retained.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, sunlit and saturated, shot on a wide lens at bumper height in warm late-afternoon light with long soft shadows and fine film grain.
      [Shot 1] The shot opens exactly on <Picture 1>: a static front-on view of <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, upright bat ears and thick gold curb-link chain, sitting upright behind the windscreen of <Subject 2> with both front paws on the white steering wheel. The camera holds still and slowly pushes in a few centimetres. She pants, tongue out, then lifts her left front paw - the one on the right-hand side of the frame from the camera's view - off the wheel rim, holds it in the air for a beat with the toes spread, and brings it down flat onto the chrome horn button at the centre of the wheel. She presses twice, two short deliberate jabs, her whole shoulder dipping with each one. As the horn sounds her eyes widen and her mouth stretches into a wider open-mouthed grin, tongue lolling further out. She returns the paw to the wheel rim and sits taller, chin up, thoroughly satisfied. Behind her a dog walking upright on the sidewalk turns its head toward the noise. No humans appear at any point.

      overall_soundscape: Open seafront ambience continues - distant surf, gulls, breeze in palm fronds. Two short bright car-horn blasts land squarely on the paw presses, a cheerful mid-pitched double toot with a small metallic ring in the tail. A soft padded thump as the paw meets the button, claws ticking on the wheel, and close flat-faced panting throughout. No speech.

      non_diegetic_music: The sunny ukulele, shaker and surf-guitar pattern continues at the same easy tempo, dropping out for a beat under the two horn blasts and returning with an added hand-clap accent.

  # =========================================================================
  # DRAFT SCENE 2 - she drives off, turns, and the city goes past
  # =========================================================================

  # -------------------------------------------------------------------------
  # 3. Pulling away.
  # -------------------------------------------------------------------------
  # The car rolls at the lens and then swings right. Note the explicit "the
  # camera never rises behind the car" - the one moment in the film where the
  # blocking would naturally put the lens on her back end.
  - id: pulling-away
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog established in <Picture 1> and <Picture 2>: compact and petite, with a narrow finely-boned head, a slender neck and a light delicate frame, a near-black brindle coat, a white chest blaze, large upright bat ears, wide round dark eyes, a short wrinkled muzzle, and a thick gold curb-link chain around her neck.
      <Subject 2> is the small glossy candy-pink open-top convertible in <Picture 1>, with its domed hood, curved fenders, round headlamps, chrome bumpers, chrome hubcaps, small windscreen and white leather interior.
      <Subject 3> is the beach dog city in <Picture 1>: a pale-concrete seafront sidewalk with pastel kiosks, leaning palms, white sand and turquoise sea, populated only by dogs walking upright on their hind legs.

      summary:
      [reference generation] The target video continues from <Picture 1>: <Subject 2> pulls away from its parking spot with <Subject 1> at the wheel, rolls slowly straight toward the camera until the pink hood nearly fills the frame, then swings right and drives out of shot along the sidewalk of <Subject 3>. <Picture 1> supplies the opening framing, car and lighting; <Picture 2> supplies her build and coat.

      retention_analysis:
      <Picture 1> ([Shot 1] opening frame): fully_preserved - the low front-on bumper-height framing, the car centred in frame, the sidewalk, palms, sea and warm late-afternoon light are retained at the start of the shot before the car advances and turns.
      <Subject 1> (appears in [Shot 1]): fully_preserved - the petite finely-boned build, near-black brindle coat, white chest blaze, upright bat ears and gold curb-link chain are retained.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the candy-pink paint, domed hood, round headlamps, chrome bumpers and hubcaps, and white leather interior are retained; the wheels now turn.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the concrete sidewalk, pastel kiosks, leaning palms, sand, sea and upright background dogs are retained.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, sunlit and saturated, shot on a wide lens at bumper height in warm late-afternoon light with long soft shadows and fine film grain.
      [Shot 1] The shot opens on <Picture 1>, the static front-on view of <Subject 2> parked on the sidewalk of <Subject 3> with <Subject 1> at the wheel - the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, upright bat ears and thick gold curb-link chain, both front paws on the white steering wheel and her tongue out. The little pink car eases forward and rolls slowly straight toward the lens, its chrome hubcaps turning and its round headlamps growing until the domed pink hood fills most of the vertical frame and she is close enough for her whiskers to catch the sun. Then she leans into a turn, the front wheels crank to the right, and the car swings across the frame from left to right, presenting its whole glossy pink flank to the camera as it straightens onto the sidewalk. The camera stays low and level throughout, panning right to follow at moderate speed, holding the car in front and side view and never rising or moving behind it. No humans appear at any point.

      overall_soundscape: Open seafront ambience throughout - distant surf, gulls, breeze in palm fronds. A small engine turns over and settles into a light putting idle, then rises to a steady low hum as the car moves off; rubber tyres crunch faintly over gritty concrete and a chassis creak accompanies the turn. Close panting sits over the top. No speech.

      non_diegetic_music: The sunny ukulele, shaker and surf-guitar pattern continues at the same easy tempo, a walking upright-bass line entering as the car begins to move and a light brush-kit joining on the turn.

  # -------------------------------------------------------------------------
  # 4. The cruise.
  # -------------------------------------------------------------------------
  # The profile tracking shot the brief asks for. Pure travelling - one action
  # (she drives, she is happy) and everything else is parallax, which is exactly
  # what fits in 3.75s at speed.
  - id: the-cruise
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog established in <Picture 1> and <Picture 2>: compact and petite, with a narrow finely-boned head, a slender neck and a light delicate frame, a near-black brindle coat, a white chest blaze, large upright bat ears, wide round dark eyes, a short wrinkled muzzle, and a thick gold curb-link chain around her neck.
      <Subject 2> is the small glossy candy-pink open-top convertible in <Picture 1>, with its domed hood, curved fenders, round headlamps, chrome bumpers, chrome hubcaps and white leather interior.
      <Subject 3> is the beach dog city in <Picture 1>: a pale-concrete seafront sidewalk with pastel kiosks, leaning palms, white sand and turquoise sea, populated only by dogs walking upright on their hind legs.

      summary:
      [reference generation] The target video is a tracking shot running alongside <Subject 2> as <Subject 1> drives it slowly along the seafront sidewalk of <Subject 3>. She is held in profile, looking straight ahead down the road with her tongue out and her ears up, the sea sliding past behind her. <Picture 1> supplies the car, her position in it and the light; <Picture 2> supplies her build and coat.

      retention_analysis:
      <Picture 1> ([Shot 1] opening frame): partially_preserved - the car, the driver, the sidewalk and the warm late-afternoon light are retained; the framing changes from a front view to a moving side view.
      <Subject 1> (appears in [Shot 1]): fully_preserved - the petite finely-boned build, near-black brindle coat, white chest blaze, upright bat ears, wrinkled muzzle and gold curb-link chain are retained, now seen from the side.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the candy-pink paint, curved fenders, chrome bumpers and hubcaps, and white leather interior are retained.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the concrete sidewalk, pastel kiosks, leaning palms, white sand and turquoise sea are retained and now move past behind the car.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, sunlit and saturated, shot on a medium lens at driver height in warm late-afternoon light with long soft shadows and fine film grain.
      [Shot 1] A smooth lateral tracking shot moves with <Subject 2> along the sidewalk of <Subject 3>, the camera locked level with the driver's seat and holding the little pink convertible in clean side profile at a constant distance. <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck and large upright bat ears, sits high on the white leather bench with both front paws on the wheel, her thick gold curb-link chain swinging gently against her white chest blaze. Her profile fills the centre of the frame: muzzle forward, eyes fixed straight ahead on the road, ears standing tall and quivering in the wind, her pink tongue hanging out sideways and fluttering. The loose skin of her cheek ripples in the airflow. Behind her, white sand, a low sea wall and calm turquoise water slide past in an even parallax, palm shadows sweeping rhythmically over the pink bodywork. The camera holds the profile for the whole shot and never falls behind the car. No humans appear at any point.

      overall_soundscape: A steady wind rush close on the microphone throughout, over open seafront ambience of distant surf and gulls. The small engine holds a low even putting hum, tyres roll steadily over gritty concrete, and quick flat-faced panting cuts through the wind. No speech.

      non_diegetic_music: The sunny ukulele, brushed kit, upright bass and reverb-heavy surf-guitar arrangement rolls on at full width in an easy cruising groove, holding a steady dynamic throughout.

  # -------------------------------------------------------------------------
  # 5. Dog city.
  # -------------------------------------------------------------------------
  # The widest shot in the film and the one that has to sell the premise, so the
  # background dogs are individually specified rather than left as "other dogs" -
  # unspecified crowds is where this model reaches for humans.
  - id: dog-city
    prompt: |-
      subject_definitions:
      <Subject 1> is the small female French bulldog established in <Picture 1> and <Picture 2>: compact and petite, with a narrow finely-boned head, a slender neck and a light delicate frame, a near-black brindle coat, a white chest blaze, large upright bat ears, a short wrinkled muzzle, and a thick gold curb-link chain around her neck.
      <Subject 2> is the small glossy candy-pink open-top convertible in <Picture 1>, with its domed hood, curved fenders, round headlamps, chrome bumpers and chrome hubcaps.
      <Subject 3> is the beach dog city in <Picture 1>: a pale-concrete seafront sidewalk with low pastel-painted kiosks, leaning palms, white sand and turquoise sea, whose only inhabitants are dogs walking upright on their hind legs and going about human business.

      summary:
      [reference generation] The target video is a wide travelling shot of <Subject 1> driving <Subject 2> at walking pace through the busy seafront promenade of <Subject 3>, past a crowd of dogs of every breed standing and walking upright on their hind legs. The mood is relaxed and cheerful and there is not a single human in the city. <Picture 1> supplies the car, the driver and the light; <Picture 2> supplies her build and coat.

      retention_analysis:
      <Picture 1> ([Shot 1] opening frame): partially_preserved - the pink car, its driver, the sidewalk and the warm late-afternoon light are retained; the framing widens and the background fills with upright dogs.
      <Subject 1> (appears in [Shot 1]): fully_preserved - the petite finely-boned build, near-black brindle coat, white chest blaze, upright bat ears and gold curb-link chain are retained at a smaller scale in frame.
      <Subject 2> (appears in [Shot 1]): fully_preserved - the candy-pink paint, curved fenders, chrome bumpers and hubcaps are retained.
      <Subject 3> (appears in [Shot 1]): fully_preserved - the concrete promenade, pastel kiosks, leaning palms, sand and turquoise sea are retained; the upright dog population is shown in full for the first time.

      detailed_description:
      The target video is photorealistic live-action cinematic footage, sunlit and saturated, shot on a wide lens at chest height in warm late-afternoon light with long soft shadows and fine film grain.
      [Shot 1] A wide travelling shot moves alongside <Subject 2> as it rolls at walking pace down the crowded promenade of <Subject 3>. <Subject 1>, the small compact female French bulldog with the narrow finely-boned head, slender neck, white chest blaze, upright bat ears and gold curb-link chain, sits small but unmistakable behind the wheel of the pink car in the lower third of the frame, tongue out, looking ahead. The promenade around her is full of dogs standing and walking upright on their hind legs like people: a tall golden retriever in an open linen shirt carries a striped surfboard under one foreleg, a dachshund in round sunglasses ambles past licking an ice cream cone, a white poodle in an apron leans out of a mint-green kiosk window handing something down, two beagles sit at a small round table under a striped umbrella, and a great dane strolls by with a rolled towel over its shoulder. Heads turn lazily toward the pink car as it passes. The camera tracks steadily and stays level. Not one human appears anywhere in the city.

