# Example movie script.
#   ./moviemakr.py render scripts/example.yaml --dry-run
#   ./moviemakr.py render scripts/example.yaml
name: cats-movie

model:
  root: /home/erika/Projects/ai-models          # host dir, mounted read-only at /models
  diffusion_model: minimax-h3/minimax_h3_ref2va_pruned-Q8_0.gguf
  llm:             minimax-h3/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  vae:             minimax-h3/minimax_h3_video_vae_fp16.safetensors
  audio_vae:       minimax-h3/minimax_h3_audio_vae_fp32.safetensors

docker:
  image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan
  devices: [/dev/dri/card1, /dev/dri/renderD128, /dev/kfd]
  # Your UID owns the GPU device ACLs, so the container can drop root and still
  # reach the GPU - which keeps rendered clips owned by you instead of root.
  run_as_current_user: true

# Every key here can be overridden on any individual scene.
defaults:
  width: 540
  height: 960
  fps: 24
  video_frames: 90          # ~5s at 24fps; the model rounds this up a little
  cfg_scale: 1.0
  seed: 42
  negative_prompt: ""
  # Appended to every scene prompt, so the look stays consistent without
  # repeating yourself in each scene.
  style_suffix: "Front camera view, indoor, cinematic, shallow depth of field."
  # --mmap matters here: ~39 GB of weights reload on every scene, and with your
  # RAM the page cache keeps them warm between runs.
  # Note: the VAE is left on the GPU on purpose - "--backend vae=cpu" made the
  # audio decode at the end of each scene much slower.
  extra_args: ["--diffusion-fa", "--mmap", "--backend", "te=cpu"]

continuity:
  # Reference images under assets/, passed to *every* scene. Use this for a
  # character sheet so the cast looks the same throughout.
  anchors: []
  # Default for last-frame chaining; individual scenes can opt in or out.
  chain_from_previous: false

output:
  container: mp4             # mp4 (h264/aac) or webm (vp9/opus)
  audio: keep                # keep the model's generated audio, or "strip"
  music: null                # optional file under assets/, mixed under the movie
  music_gain_db: -18

scenes:
  - id: opening
    prompt: >-
      Three cats standing up on their back feet in a human-like pose,
      dancing a choreographed dance.
    seed: 1234

  - id: kitchen
    prompt: >-
      The same three cats walk into a bright kitchen and open the fridge door,
      peering inside at the light.
    # Feed the final frame of the previous scene in as a reference image,
    # so this shot picks up where the last one left off.
    chain_from_previous: true

  - id: feast
    prompt: >-
      The three cats sit around a small table sharing a plate of fish,
      looking pleased with themselves.
    chain_from_previous: true
    video_frames: 86
